<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar</title>
<meta name="theme-color" content="#2b1c44">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="reservar.css">
</head>
<body>
<div id="app"><p class="muted" style="text-align:center;margin-top:30vh"><img class="tw3d" src="tuweeb-icono.svg" alt="tuweeb"></p></div>
<script>/* arranque rápido: pide la config y los horarios del mes al mismo tiempo (antes iban uno después del otro) */
(function(){try{if(window.TEMA)return;var d=new Date(),m=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2),P=window.__pre={mes:m};
P.cfg=fetch('config.json',{cache:'no-cache'}).then(function(r){return r.json()});
var u=P.cfg.then(function(c){return /PENDIENTE/.test(c.api||'')?null:c.api});
P.pub=u.then(function(a){return a?fetch(a+'?action=config').then(function(r){return r.json()}):null}).catch(function(){return null});
P.disp=u.then(function(a){return a?fetch(a+'?action=disponibilidad&mes='+m).then(function(r){return r.json()}):null}).catch(function(){return null});
P.cfg.catch(function(){window.__pre=null})}catch(e){window.__pre=null}})();</script>
<script src="reservar.js"></script>
</body>
</html>
