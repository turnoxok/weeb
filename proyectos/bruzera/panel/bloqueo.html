<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Bloqueos de turnos - Dra. Lili Bruzera</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #FAF6F0;
    --rosa: #C42685;
    --violeta: #362A6F;
    --violeta-suave: #EAE8F5;
    --texto-suave: #7A6E85;
    --libre: #2E8B57;
    --bloqueado: #993b74;
    --ajeno: #B9B3C2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    margin: 0; padding: 20px;
    color: #2A2235;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--violeta);
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 4px;
  }
  p.subtitulo {
    text-align: center; color: var(--texto-suave);
    margin-top: 0; margin-bottom: 24px; font-size: .9rem;
  }
  .contenedor {
    max-width: 480px; margin: 0 auto;
    background: #fff; border-radius: 20px; padding: 20px;
    box-shadow: 0 10px 30px rgba(54,42,111,0.1);
  }
  .calendario-header {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--violeta), var(--rosa));
    color: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px;
  }
  .calendario-header button {
    background: #fff; border: none; color: var(--rosa);
    font-weight: bold; padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .dias-semana {
    display: grid; grid-template-columns: repeat(7,1fr);
    text-align: center; font-size: .75rem; font-weight: 700;
    color: var(--violeta); margin-bottom: 4px;
  }
  .dias { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 18px; }
  .dia {
    padding: 8px 0; text-align: center; border-radius: 8px; cursor: pointer;
    font-size: .85rem; background: var(--violeta-suave);
  }
  .dia.disabled { visibility: hidden; }
  .dia.pasado { color: #ccc; background: transparent; cursor: default; }
  .dia.seleccionado { background: var(--violeta); color: #fff; font-weight: 700; }

  #tituloDia { color: var(--rosa); font-size: 1rem; margin: 0 0 10px; text-align: center; }
  #estadoCarga { text-align: center; color: var(--texto-suave); font-style: italic; font-size: .85rem; }

  h4.bloque-titulo {
    color: var(--violeta); font-size: .9rem; margin: 14px 0 6px;
  }
  .grid-turnos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .turno-btn {
    border: none; border-radius: 999px; padding: 10px 6px;
    font-weight: 700; font-size: .9rem; color: #fff; cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .turno-btn:active { transform: scale(0.96); }
  .turno-btn.libre     { background: var(--libre); }
  .turno-btn.bloqueado { background: var(--bloqueado); }
  .turno-btn.ajeno     { background: var(--ajeno); cursor: not-allowed; }

  .leyenda {
    display: flex; justify-content: center; gap: 14px; margin-top: 16px;
    font-size: .78rem; color: var(--texto-suave); flex-wrap: wrap;
  }
  .leyenda span { display: flex; align-items: center; gap: 5px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  #overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.75);
    display: none; align-items: center; justify-content: center;
    font-weight: 700; color: var(--violeta); z-index: 999;
  }
</style>
</head>
<body>

<h1>Bloqueo de turnos</h1>
<p class="subtitulo">Un clic para tomar u ocupar un turno sin cargar datos reales.</p>

<div class="contenedor">
  <div class="calendario-header">
    <button onclick="cambiarMes(-1)">←</button>
    <strong id="mesActual"></strong>
    <button onclick="cambiarMes(1)">→</button>
  </div>
  <div class="dias-semana">
    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
  </div>
  <div class="dias" id="dias"></div>

  <div id="panelTurnos" style="display:none;">
    <h3 id="tituloDia"></h3>
    <p id="estadoCarga">Cargando turnos...</p>
    <div id="contenidoTurnos"></div>
  </div>

  <div class="leyenda">
    <span><span class="punto" style="background:var(--libre)"></span> Libre</span>
    <span><span class="punto" style="background:var(--bloqueado)"></span> Bloqueado por vos</span>
    <span><span class="punto" style="background:var(--ajeno)"></span> Reserva de cliente</span>
  </div>
</div>

<div id="overlay">Actualizando...</div>

<script>
// ============================================================
// CONFIG — misma URL que usa el turnero público
// ============================================================
const urlScript = "https://script.google.com/macros/s/AKfycbzyYAPMe1xFdiTf_UBzZjizROc-B-Dd3X8PiYJyQSTmWR7D_gQhQmfHpgO-iX5Pt8dU4A/exec";

const turnosPorDia = {
  "lunes":    { manana:["09:00","09:30","10:00","10:30","11:00","11:30"], tarde:["17:00","17:30","18:00","18:30","19:00","19:30","20:00"] },
  "martes":   { manana:["09:00","09:30","10:00","10:30","11:00","11:30"], tarde:["17:00","17:30","18:00","18:30","19:00","19:30","20:00"] },
  "miércoles":{ manana:["09:00","09:30","10:00","10:30","11:00","11:30"], tarde:["17:00","17:30","18:00","18:30","19:00","19:30","20:00"] },
  "jueves":   { manana:["09:00","09:30","10:00","10:30","11:00","11:30"], tarde:["17:00","17:30","18:00","18:30","19:00","19:30","20:00"] },
  "viernes":  { manana:["09:00","09:30","10:00","10:30","11:00","11:30"], tarde:["17:00","17:30","18:00","18:30","19:00","19:30","20:00"] },
  "sábado":   { manana:["10:00","10:30","11:00","11:30","12:00","12:30"], tarde:[] },
  "domingo":  { manana:[], tarde:[] }
};
const nombresDias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

let fechaCalendario = new Date();
let diaSeleccionado = null;
let turnosOcupados = [];

function fmt(f) {
  return `${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`;
}

function renderizarCalendario() {
  const diasEl = document.getElementById("dias");
  const mesEl  = document.getElementById("mesActual");
  diasEl.innerHTML = "";
  const año = fechaCalendario.getFullYear(), mes = fechaCalendario.getMonth();
  const primerDia = new Date(año, mes, 1);
  const diasMes   = new Date(año, mes+1, 0).getDate();
  mesEl.textContent = fechaCalendario.toLocaleDateString("es-ES", {month:"long", year:"numeric"});
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  for (let i = 0; i < primerDia.getDay(); i++) diasEl.innerHTML += `<div class="dia disabled"></div>`;
  for (let i = 1; i <= diasMes; i++) {
    const d = new Date(año, mes, i);
    const cls = d < hoy ? "dia pasado" : "dia";
    diasEl.innerHTML += `<div class="${cls}" data-d="${i}" data-m="${mes}" data-y="${año}">${i}</div>`;
  }
  diasEl.querySelectorAll('.dia:not(.disabled):not(.pasado)').forEach(el => {
    el.addEventListener('click', () => seleccionarDia(+el.dataset.y, +el.dataset.m, +el.dataset.d, el));
  });
}
function cambiarMes(dir) { fechaCalendario.setMonth(fechaCalendario.getMonth()+dir); renderizarCalendario(); }

function seleccionarDia(y, m, d, elDia) {
  document.querySelectorAll('.dia.seleccionado').forEach(e => e.classList.remove('seleccionado'));
  elDia.classList.add('seleccionado');
  diaSeleccionado = new Date(y, m, d);

  document.getElementById("panelTurnos").style.display = "block";
  document.getElementById("tituloDia").textContent = "Turnos · " + fmt(diaSeleccionado);
  document.getElementById("estadoCarga").style.display = "block";
  document.getElementById("estadoCarga").textContent = "Cargando turnos...";
  document.getElementById("contenidoTurnos").innerHTML = "";

  fetch(urlScript)
    .then(r => r.json())
    .then(data => {
      turnosOcupados = data.turnosOcupados || [];
      renderizarTurnos();
    })
    .catch(() => {
      document.getElementById("estadoCarga").textContent = "Error al cargar turnos.";
    });
}

function renderizarTurnos() {
  const fechaTxt  = fmt(diaSeleccionado);
  const nombreDia = nombresDias[diaSeleccionado.getDay()];
  const { manana = [], tarde = [] } = turnosPorDia[nombreDia] || {};
  const cont = document.getElementById("contenidoTurnos");
  const estado = document.getElementById("estadoCarga");
  cont.innerHTML = "";
  estado.style.display = "none";

  if (manana.length === 0 && tarde.length === 0) {
    cont.innerHTML = "<p style='color:var(--texto-suave)'><em>Este día no tiene turnos configurados.</em></p>";
    return;
  }

  function bloque(titulo, lista) {
    if (lista.length === 0) return;
    const h = document.createElement("h4");
    h.className = "bloque-titulo";
    h.textContent = titulo;
    cont.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "grid-turnos";

    lista.forEach(t => {
      const info = turnosOcupados.find(o => o.fecha === fechaTxt && o.turno === t);
      const btn = document.createElement("button");
      btn.textContent = t;
      btn.className = "turno-btn " + (!info ? "libre" : (info.bloqueado ? "bloqueado" : "ajeno"));

      if (!info) {
        btn.onclick = () => toggleTurno(fechaTxt, t, "bloquear", btn);
      } else if (info.bloqueado) {
        btn.onclick = () => toggleTurno(fechaTxt, t, "desbloquear", btn);
      }
      // si es "ajeno" (reserva real), no se asigna onclick → no clickeable

      grid.appendChild(btn);
    });
    cont.appendChild(grid);
  }

  bloque("Por la mañana:", manana);
  bloque("Por la tarde:", tarde);
}

function toggleTurno(fecha, turno, accion, btn) {
  document.getElementById("overlay").style.display = "flex";
  fetch(urlScript, {
    method: "POST",
    body: new URLSearchParams({ accion, fecha, turno })
  })
  .then(r => r.json())
  .then(res => {
    document.getElementById("overlay").style.display = "none";
    if (res.success) {
      seleccionarDia(diaSeleccionado.getFullYear(), diaSeleccionado.getMonth(), diaSeleccionado.getDate(),
        document.querySelector('.dia.seleccionado'));
    } else {
      alert(res.error || "No se pudo actualizar el turno.");
    }
  })
  .catch(() => {
    document.getElementById("overlay").style.display = "none";
    alert("Error de conexión.");
  });
}

document.addEventListener("DOMContentLoaded", renderizarCalendario);
</script>
</body>
</html>
