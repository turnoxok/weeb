                  <Group id="vig" title="Viñeta" toggle={{ checked: postFx.vignetteEnabled, onChange: (v) => setPostFxField("vignetteEnabled", v) }}>
                    <Slider label="Oscuridad" min={0} max={1} step={0.01} value={postFx.vignetteDarkness} onChange={(v) => setPostFxField("vignetteDarkness", v)} />
                    <Slider label="Alcance" min={0} max={1} step={0.01} value={postFx.vignetteOffset} onChange={(v) => setPostFxField("vignetteOffset", v)} />
                  </Group>
                  <Group id="bloom" title="Bloom" toggle={{ checked: postFx.bloomEnabled, onChange: (v) => setPostFxField("bloomEnabled", v) }}>
                    <Slider label="Intens." min={0} max={2} step={0.01} value={postFx.bloomIntensity} onChange={(v) => setPostFxField("bloomIntensity", v)} />
                  </Group>
                  <Group id="dof" title="Desenfoque (profundidad de campo)" toggle={{ checked: !!postFx.dofEnabled, onChange: (v) => setPostFxField("dofEnabled", v) }}>
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Desenfoca según la distancia a la cámara. Con "Solo el fondo" queda nítido todo lo que está entre la cámara y el plano de foco, y se desenfoca lo que queda detrás. Solo en equipos con calidad alta (en celulares se apaga solo).</div>
                    <Switch label="Solo desenfocar el fondo (lo de atrás)" checked={postFx.dofBack !== false} onChange={(v) => setPostFxField("dofBack", v)} />
                    <Switch label="Enfocar donde mira la cámara" checked={postFx.dofFollow !== false} onChange={(v) => setPostFxField("dofFollow", v)} />
                    {postFx.dofFollow !== false
                      ? <Slider label="Profundidad nítida (detrás del objetivo)" min={-10} max={200} step={0.1} value={postFx.dofOffset ?? 1} onChange={(v) => setPostFxField("dofOffset", v)} />
                      : <Slider label="Distancia de foco (desde la cámara)" min={0.5} max={300} step={0.1} value={postFx.dofDistance ?? 8} onChange={(v) => setPostFxField("dofDistance", v)} />}
                    <Slider label="Transición (suavidad)" min={0.2} max={300} step={0.1} value={postFx.dofRange ?? 8} onChange={(v) => setPostFxField("dofRange", v)} />
                    <Slider label="Intensidad del desenfoque" min={0} max={10} step={0.1} value={postFx.dofBlur ?? 3} onChange={(v) => setPostFxField("dofBlur", v)} />
                  </Group>
                  <Group id="env" title="Entorno de reflejos (metal / vidrio)" toggle={{ checked: postFx.envEnabled ?? true, onChange: (v) => setPostFxField("envEnabled", v) }}>
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Un "estudio" invisible (softboxes) que los materiales metálicos reflejan desde cualquier ángulo. No se ve de fondo: el fondo no cambia. Se aplica a los modelos .glb de la pestaña Objetos. Sale igual en el index.html y en el MP4.</div>
                    <Slider label="Intensidad" min={0} max={3} step={0.05} value={postFx.envIntensity ?? 0.8} onChange={(v) => setPostFxField("envIntensity", v)} />
                  </Group>
                  <Group id="rig" title="Luz de estudio y piso">
                    <ColorRow label="Color de acento" value={postFx.accent || "#ffffff"} onChange={(v) => setPostFxField("accent", v)} />
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Cambia de una vez el color del contraluz, del entorno de reflejos y del foco de fondo (el lila/magenta de Estudio). Blanco = neutro. <span style={{ color: "var(--acc)", cursor: "pointer", textDecoration: "underline" }} onClick={() => setPostFxField("accent", "")}>Volver al color original (por pose)</span>{postFx.accent ? ` · Activo: ${postFx.accent}` : " · Activo: original"}</div>
                    <Seg value={postFx.lightRig === "studio" ? "studio" : "classic"} onChange={(v) => setPostFxField("lightRig", v)} options={[["classic", "Clásica"], ["studio", "Estudio"]]} />
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Estudio: un spot con sombra suave + rim de color atrás + softboxes para los reflejos, casi sin luz ambiente. Usa la dirección, color e intensidad de la luz de cada pose. El tone mapping ahora va siempre (antes con Bloom los colores se quemaban).</div>
                    <Slider label="Umbral bloom" min={0} max={1.5} step={0.01} value={postFx.bloomThreshold ?? 0.25} onChange={(v) => setPostFxField("bloomThreshold", v)} />
                    <Switch label="Piso reflectante (extras.reflector del .glb)" checked={postFx.floorReflect !== false} onChange={(v) => setPostFxField("floorReflect", v)} />
                    {postFx.floorReflect !== false && <Slider label="Reflejo" min={0} max={1.5} step={0.01} value={postFx.floorReflectStrength ?? 0.5} onChange={(v) => setPostFxField("floorReflectStrength", v)} />}
                    <Switch label="Sombra de contacto (sobre el piso reflectante)" checked={!!postFx.contactShadow} onChange={(v) => setPostFxField("contactShadow", v)} />
                    {postFx.contactShadow && <Slider label="Opacidad" min={0} max={1} step={0.01} value={postFx.contactShadowOpacity ?? 0.75} onChange={(v) => setPostFxField("contactShadowOpacity", v)} />}
                    <Switch label="Oclusión ambiental (huecos y encastres)" checked={!!postFx.aoEnabled} onChange={(v) => setPostFxField("aoEnabled", v)} />
                    {postFx.aoEnabled && <Slider label="Intensidad AO" min={0} max={5} step={0.05} value={postFx.aoIntensity ?? 2} onChange={(v) => setPostFxField("aoIntensity", v)} />}
                    {postFx.aoEnabled && <Slider label="Radio AO" min={0.05} max={2} step={0.01} value={postFx.aoRadius ?? 0.35} onChange={(v) => setPostFxField("aoRadius", v)} />}
                  </Group>
                  <Group id="beam" title="Rayo de luz" toggle={{ checked: postFx.beamEnabled, onChange: (v) => setPostFxField("beamEnabled", v) }}>
                    <Slider label="Opacidad" min={0} max={1} step={0.01} value={postFx.beamOpacity} onChange={(v) => setPostFxField("beamOpacity", v)} />
                    <Slider label="Ancho" min={0.2} max={10} step={0.1} value={postFx.beamWidth} onChange={(v) => setPostFxField("beamWidth", v)} />
                    <Slider label="Largo" min={2} max={40} step={0.5} value={postFx.beamHeight} onChange={(v) => setPostFxField("beamHeight", v)} />
                    <Slider label="Difuminado final" min={0} max={1} step={0.01} value={postFx.beamSoft ?? 0.5} onChange={(v) => setPostFxField("beamSoft", v)} />
                    <Slider label="Halo del final" min={0} max={1} step={0.01} value={postFx.beamGlow ?? 0.35} onChange={(v) => setPostFxField("beamGlow", v)} />
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Dónde termina el rayo (donde "cae"). Altura: subila para que termine en el aire, bajala para que atraviese la grilla.</div>
                    <Slider label="Final · X" min={-10} max={10} step={0.1} value={postFx.beamTx ?? 0} onChange={(v) => setPostFxField("beamTx", v)} />
                    <Slider label="Final · Altura" min={-10} max={10} step={0.1} value={postFx.beamTy ?? 0} onChange={(v) => setPostFxField("beamTy", v)} />
                    <Slider label="Final · Z" min={-10} max={10} step={0.1} value={postFx.beamTz ?? 0} onChange={(v) => setPostFxField("beamTz", v)} />
                  </Group>
                  <Group id="particles" title="Partículas (polvo / bokeh)" toggle={{ checked: !!postFx.partEnabled, onChange: (v) => setPostFxField("partEnabled", v) }}>
                    <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Polvo en suspensión como en el cine: flota en el espacio 3D (tiene parallax con el scroll) y se desenfoca según la distancia al punto que mira la cámara. Sale igual en el index.html y en el MP4.</div>
                    <Slider label="Cantidad" min={50} max={2500} step={10} value={postFx.partCount ?? 650} onChange={(v) => setPostFxField("partCount", v)} />
                    <Slider label="Intensidad" min={0} max={1} step={0.01} value={postFx.partOpacity ?? 0.65} onChange={(v) => setPostFxField("partOpacity", v)} />
                    <Slider label="Tamaño" min={0.3} max={3} step={0.05} value={postFx.partSize ?? 1} onChange={(v) => setPostFxField("partSize", v)} />
                    <Slider label="Desenfoque (bokeh)" min={0} max={1} step={0.01} value={postFx.partBlur ?? 0.6} onChange={(v) => setPostFxField("partBlur", v)} />
                    <Slider label="Velocidad" min={0} max={3} step={0.05} value={postFx.partSpeed ?? 1} onChange={(v) => setPostFxField("partSpeed", v)} />
                    <Slider label="Alcance" min={6} max={40} step={0.5} value={postFx.partRange ?? 16} onChange={(v) => setPostFxField("partRange", v)} />
                    <Slider label="Brillo en el rayo" min={0} max={1} step={0.01} value={postFx.partBeam ?? 0.6} onChange={(v) => setPostFxField("partBeam", v)} />
                  </Group>
                  </>
                )}
              </>
            )}

            {section === "pose" && (
              <>
                <div className="tools">
                  <Btn icon="copy" onClick={copyCharFromPrev} disabled={stageIndex <= 0}>Desde anterior</Btn>
                  <Btn icon="reset" onClick={resetAllBones}>Reset huesos</Btn>
                  {noBonesFound && <span className="warn">Modelo sin huesos</span>}
                </div>
                <Group id="mv" title="Posición y giro del personaje">
                  <Vec3 label="Posición" value={mv.pos} onChange={(a, v) => setMoveField("pos", a, v)} />
                  <Slider label="Giro (yaw)" min={-180} max={180} step={0.1} value={mv.yaw} onChange={(v) => setMoveField("yaw", null, v)} />
                  <Presets items={[["Frente", 0], ["Der. 90°", -90], ["Izq. 90°", 90], ["Espalda", 180]]} onPick={applyYawPreset} />
                  <Slider label="Pitch" min={-90} max={90} step={0.1} value={mv.pitch} onChange={(v) => setMoveField("pitch", null, v)} />
                  <Presets items={[["Neutro", 0], ["Adelante", 60], ["Atrás", -60]]} onPick={applyPitchPreset} />
                </Group>
                {BONE_GROUPS.map(([gid, title, keys]) => {
                  const n = keys.filter((k) => { const v = boneVal(k); return v.x || v.y || v.z; }).length;
                  return (
                    <Group key={gid} id={"bones-" + gid} title={title + (n ? " · " + n + " con giro" : "")} defaultOpen={gid === "torso"}>
                      {keys.map(renderBoneRow)}
                    </Group>
                  );
                })}
                <div className="tools">
                  <Btn icon="copy" title="Copia los giros del lado izquierdo al derecho (espejo)" onClick={() => mirrorBones("l")}>Espejar izq → der</Btn>
                  <Btn icon="copy" title="Copia los giros del lado derecho al izquierdo (espejo)" onClick={() => mirrorBones("r")}>Espejar der → izq</Btn>
                </div>
              </>
            )}

            {section === "camera" && (
              <>
                <div className="tools">
                  <Btn icon="copy" onClick={copyCamFromPrev} disabled={stageIndex <= 0}>Desde anterior</Btn>
                  <Btn icon="capture" kind="acc" onClick={captureFreeCamera} disabled={!freeOrbit} title="Activá «Libre» en el visor">Capturar vista</Btn>
                </div>
                <div className="tools">
                  <Btn icon="copy" onClick={() => addOrbitLap(1)} title="Agrega 4 poses que giran 360° alrededor de «Mira a», desde la cámara de esta pose">Vuelta 360° ↻</Btn>
                  <Btn icon="copy" onClick={() => addOrbitLap(-1)} title="Igual, en sentido contrario">Vuelta 360° ↺</Btn>
                </div>
                <Switch checked={!!cam.arc} onChange={(v) => setCamsByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], arc: v } }))} label="Ir en arco hasta esta pose (gira alrededor de «Mira a»)" />
                <Group id="cam" title="Cámara">
                  <Vec3 label="Posición" value={cam.position} onChange={(a, v) => setCamField("position", a, v)} />
                  <Vec3 label="Mira a" value={cam.lookAt} onChange={(a, v) => setCamField("lookAt", a, v)} />
                  <Slider label="FOV" min={10} max={90} step={0.1} value={cam.fov} onChange={(v) => setCamField("fov", null, v)} />
                  <Slider label="Roll" min={-180} max={180} step={0.1} value={cam.roll || 0} onChange={(v) => setCamField("roll", null, v)} />
                </Group>
                <Group id="light" title="Luz principal">
                  <ColorRow label="Color" value={fxs.light.color} onChange={(v) => setFxField("light", "color", v)} />
                  <Slider label="Intens." min={0} max={5} step={0.05} value={fxs.light.intensity} onChange={(v) => setFxField("light", "intensity", v)} />
                  <Slider label="Ambiente" min={0} max={3} step={0.01} value={fxs.light.ambient ?? 0.28} onChange={(v) => setFxField("light", "ambient", v)} />
                  <Slider label="Azimut" min={0} max={360} step={1} value={fxs.light.azimuth ?? 45} onChange={(v) => setFxField("light", "azimuth", v)} />
                  <Slider label="Altura" min={-90} max={90} step={1} value={fxs.light.elevation ?? 35} onChange={(v) => setFxField("light", "elevation", v)} />
                </Group>
                <Group id="rim" title="Luz de contorno">
                  <ColorRow label="Color" value={fxs.light.rimColor} onChange={(v) => setFxField("light", "rimColor", v)} />
                  <Slider label="Intens." min={0} max={5} step={0.05} value={fxs.light.rimIntensity} onChange={(v) => setFxField("light", "rimIntensity", v)} />
                </Group>
                <Group id="fog" title="Niebla" toggle={{ checked: fxs.fog.enabled !== false, onChange: (v) => setFxField("fog", "enabled", v) }}>
                  <ColorRow label="Color" value={fxs.fog.color} onChange={(v) => setFxField("fog", "color", v)} />
                  <Slider label="Alcance" min={0} max={300} step={0.5} value={fxs.fog.far} onChange={(v) => setFxField("fog", "far", v)} />
                </Group>
                <Group id="bg" title="Fondo">
                  <Seg value={fxs.background.mode === "gradient" ? "gradient" : fxs.background.mode === "transparent" ? "transparent" : "solid"} onChange={setBackgroundMode} options={[["solid", "Sólido"], ["gradient", "Degradado"], ["transparent", "Transparente"]]} />
                  {fxs.background.mode !== "transparent" && <ColorRow label={fxs.background.mode === "gradient" ? "Desde" : "Color"} value={fxs.background.from} onChange={(v) => setBackgroundColor("from", v)} />}
                  {fxs.background.mode === "gradient" && (
                    <>
                      <Switch checked={!!fxs.background.midOn} onChange={toggleBackgroundMid} label="Color intermedio (3 colores)" />
                      {fxs.background.midOn && (
                        <>
                          <ColorRow label="Medio" value={fxs.background.mid || "#808080"} onChange={(v) => setBackgroundColor("mid", v)} />
                          <Slider label="Posición %" min={0} max={100} step={1} value={fxs.background.midPos == null ? 50 : fxs.background.midPos} onChange={(v) => setFxField("background", "midPos", v)} />
                        </>
                      )}
                      <ColorRow label="Hasta" value={fxs.background.to} onChange={(v) => setBackgroundColor("to", v)} />
                      <Slider label="Ángulo" min={0} max={360} step={1} value={fxs.background.angle ?? 180} onChange={(v) => setFxField("background", "angle", v)} />
                    </>
                  )}
                </Group>
              </>
            )}

            {section === "timing" && (
              nStages < 2 ? <div className="empty">Agregá una 2ª pose</div> : (
                <>
                  <div className="tl">{durationsVh.map((d, i) => <div key={i} style={{ flexGrow: d }}>{i + 1}→{i + 2}</div>)}</div>
                  <div className="stat">Total {Math.round(totalVh)} vh</div>
                  {(() => {
                    const autoSpeed = Math.max(1, Math.min(15, Math.round((totalVh / Math.max(1, durationsVh.length) / 132) * 2) / 2));
                    const setSc = (patch) => setPostFx((p) => ({ ...p, ...patch }));
                    return (
                      <Group id="scrollfeel" title="Velocidad del scroll (en el sitio)">
                        <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>Con proyectos largos hay que scrollear muchísimo. La velocidad hace que cada vuelta de rueda o deslizamiento de dedo avance más. El límite evita que una sacudida fuerte pase todas las poses volando.</div>
                        <Switch label={`Velocidad automática (según el largo: ×${autoSpeed})`} checked={!(postFx.scrollSpeed > 0)} onChange={(v) => setSc({ scrollSpeed: v ? 0 : autoSpeed })} />
                        {postFx.scrollSpeed > 0 && <Slider label="Velocidad (×)" min={1} max={20} step={0.5} value={postFx.scrollSpeed} onChange={(v) => setSc({ scrollSpeed: v })} />}
                        <Slider label="Límite (poses por segundo, 0 = sin límite)" min={0} max={6} step={0.1} value={postFx.scrollMaxPps ?? 1.5} onChange={(v) => setSc({ scrollMaxPps: v })} />
                        <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4, marginTop: 10 }}>Celular (pantalla táctil). No cambia nada en la PC.</div>
                        <Switch label="Una pose por deslizamiento" checked={!!postFx.mobileSnap} onChange={(v) => setSc({ mobileSnap: v })} />
                        <SelectRow label="Scroll en las páginas 2D" value={postFx.scroll2d === "smooth" ? "smooth" : "native"} onChange={(v) => setSc({ scroll2d: v })} options={[["native", "Nativo del navegador (máxima fluidez, recomendado)"], ["smooth", "Amortiguado (como el 3D, más pesado)"]]} />
                        <Slider label={"Largo del recorrido 3D en celular (" + Math.round(postFx.mobileLength || 100) + "%)"} min={30} max={100} step={5} value={postFx.mobileLength || 100} onChange={(v) => setSc({ mobileLength: v })} />
                        <Switch checked={!!postFx.mobileShadows} onChange={(v) => setSc({ mobileShadows: v })} label="Sombras de los spots en celular (más pesado)" />
                        <Slider label="Luces máximas en celular (0 = todas)" min={0} max={20} step={1} value={postFx.mobileLights ?? 6} onChange={(v) => setSc({ mobileLights: v })} />
                        {!postFx.mobileSnap && <Slider label={`Velocidad celular (0 = auto ×${Math.max(1, Math.round((postFx.scrollSpeed > 0 ? postFx.scrollSpeed : autoSpeed) * 0.4 * 2) / 2)})`} min={0} max={15} step={0.5} value={postFx.scrollSpeedMobile ?? 0} onChange={(v) => setSc({ scrollSpeedMobile: v })} />}
                        {!postFx.mobileSnap && <Slider label="Inercia del dedo" min={0} max={20} step={1} value={postFx.touchInertia ?? 6} onChange={(v) => setSc({ touchInertia: v })} />}
                      </Group>
                    );
                  })()}
                  {durationsVh.map((d, i) => (
                    <div className="row" key={stagesComputed[i + 1].id}>
                      <span className="tr-n">{i + 1}→{i + 2}</span>
                      <input type="range" min={20} max={800} step={5} value={clamp(d, 20, 800)} style={{ "--pct": ((clamp(d, 20, 800) - 20) / 780) * 100 + "%" }} onChange={(e) => setDurationAt(i, Number(e.target.value))} />
                      <Num value={d} step={5} onChange={(v) => setDurationAt(i, v)} />
                      <select value={easings[i] || "smooth"} onChange={(e) => setEasingAt(i, e.target.value)} style={{ width: 120 }}>
                        <optgroup label="Clásicas"><option value="smooth">Suave</option><option value="linear">Lineal</option><option value="easeIn">Entrada</option><option value="easeOut">Salida</option><option value="inOutCubic">Cúbica</option></optgroup>
                        <optgroup label="Cinematográficas"><option value="inOutQuart">Cinemática</option><option value="inOutQuint">Cinemática fuerte</option><option value="inOutExpo">Cinemática extrema</option><option value="inQuart">Arranque lento</option><option value="inExpo">Arranque larguísimo</option><option value="outQuart">Frenada larga</option><option value="outExpo">Frenada larguísima</option></optgroup>
                        <optgroup label="Cámara lenta al centro"><option value="slowMid">Cámara lenta</option><option value="slowMidStrong">Cámara lenta fuerte</option><option value="slowMidHold">Casi pausa en el centro</option></optgroup>
                        <optgroup label="Con rebote"><option value="outBack">Rebote leve</option><option value="inOutBack">Rebote ida y vuelta</option><option value="outElastic">Elástico</option></optgroup>
                      </select>
                    </div>
                  ))}
                </>
              )
            )}

            {section === "objects" && (
              <>
                <div className="tools">
                  <Btn icon="cube" onClick={() => addObject("model")}>Modelo</Btn>
                  <Btn icon="image" onClick={() => addObject("image")}>Imagen</Btn>
                  <Btn icon="video" onClick={() => addObject("video")}>Video</Btn>
                  <Btn icon="text" onClick={() => addObject("text")}>Texto</Btn>
                  <Btn icon="shape" onClick={() => addObject("shape")}>Forma</Btn>
                  <Btn icon="light" onClick={() => addObject("light")}>Luz</Btn>
                  <Btn icon="smoke" onClick={() => addObject("smoke")}>Humo</Btn>
                  <span className="grow" />
                  <IBtn icon="copy" title="Todos desde la pose anterior" disabled={stageIndex <= 0 || !objects.length} onClick={copyAllObjectTransformsFromPrev} />
                  <IBtn icon="pin" title="Fijar todos en todas las poses" disabled={!objects.length} onClick={applyAllObjectTransformsToAllStages} />
                </div>
                {objects.length > 3 && <Switch checked={objOnlyVisible} onChange={setObjOnlyVisible} label={`Solo los visibles en esta pose (${objects.filter(isVisibleHere).length} de ${objects.length})`} />}
                {missingFiles.length > 0 && (
                  <div className="err" style={{ fontSize: 11, lineHeight: 1.4, marginBottom: 6 }}>
                    ⚠ {missingFiles.length === 1 ? "Falta 1 archivo" : `Faltan ${missingFiles.length} archivos`} en la carpeta del sitio, por eso {missingFiles.length === 1 ? "ese objeto no se ve" : "esos objetos no se ven"}: {missingFiles.slice(0, 6).map((m) => `${m.label} → ${m.url}`).join(" · ")}{missingFiles.length > 6 ? " …" : ""}. Subí esos archivos al repo (a la carpeta indicada) o usá «Subir archivo» en cada objeto para verlos ahora.
                  </div>
                )}
                {objects.length > 6 && <input type="text" placeholder={`Buscar entre ${objects.length} objetos…`} value={objSearch} onChange={(e) => setObjSearch(e.target.value)} style={{ width: "100%", marginBottom: 6 }} />}
                <div className="outliner">
                  {objects.map((o, i) => (objOnlyVisible && !isVisibleHere(o) && !(selObj && selObj.id === o.id)) || (objSearch.trim() && !String(o.label).toLowerCase().includes(objSearch.trim().toLowerCase()) && !(selObj && selObj.id === o.id)) ? null : (
                    <div key={o.id} className={`orow ${selObj && selObj.id === o.id ? "sel" : ""} ${o.visible && !(objectTransformsByKf[o.id] && objectTransformsByKf[o.id][activeStage] && objectTransformsByKf[o.id][activeStage].hidden) ? "" : "off"}`} style={{ "--oc": colorOf(o, i) }} onClick={() => setSelectedObj(o.id)}>
                      <span className="oico"><Icon name={o.type === "text" ? "text" : o.type === "shape" ? "shape" : o.type === "light" ? "light" : o.type === "smoke" ? "smoke" : o.type === "image" ? "image" : o.type === "video" ? "video" : "cube"} size={15} /></span>
                      <span className="oname">{o.parent && objects.some((q) => q.id === o.parent) ? "↳ " : ""}{o.label}{objects.some((q) => q.parent === o.id) ? " ⛓" : ""}{missingFiles.some((m) => m.id === o.id) ? " ⚠" : ""}</span>
                      <button className="mini" title="Visible" onClick={(e) => { e.stopPropagation(); updateObject(o.id, { visible: !o.visible }); }}><Icon name={o.visible ? "eye" : "eyeoff"} size={14} /></button>
                      <button className="mini" title="Duplicar (usa el mismo archivo)" onClick={(e) => { e.stopPropagation(); duplicateObject(o.id); }}><Icon name="copy" size={14} /></button>
                      <button className="mini danger" title="Eliminar" onClick={(e) => { e.stopPropagation(); removeObject(o.id); }}><Icon name="trash" size={14} /></button>
                    </div>
                  ))}
                  {!objects.length && <div className="empty">Sin objetos</div>}
                </div>
                {selObj && renderObjectEditor(selObj, objects.indexOf(selObj))}
              </>
            )}

            {section === "preview" && (
              <Slider label="Velocidad" min={0.1} max={3} step={0.05} value={playSpeed} onChange={setPlaySpeed} />
            )}

            {section === "pages" && <PagesPanel sections={sections} setSections={setSections} site2d={site2d} setSite2d={setSite2d} selSec={selSec} setSelSec={setSelSec} nStages={nStages} totalVh={totalVh} durationsVh={durationsVh} toast={showMsg} />}
            {section === "seo" && <SeoPanel seo={seo} setSeoField={setSeoField} pack={seoPack} dock={dock} />}
            {section === "file" && (
              <>
                <Group id="proj" title="Proyecto">
                  <div className="row"><span className="lbl">Nombre</span><input type="text" style={{ flex: 1 }} value={projectName} onChange={(e) => setProjectName(e.target.value)} /></div>
                  <div className="tools">
                    <label className="btn"><Icon name="open" size={14} />Abrir .json
                      <input type="file" accept=".json,application/json" onChange={(e) => { loadProject(e.target.files[0]); e.target.value = ""; }} />
                    </label>
                    <Btn icon="file" onClick={saveProject}>Guardar .json</Btn>
                    <Btn icon="file" onClick={saveProjectAsEditor}>Editor .html</Btn>
                    <Btn icon="copy" onClick={copyEditorHtml}>Copiar editor .html</Btn>
                  </div>
                  <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>«Editor .html» descarga (o «Copiar editor» copia) esta misma herramienta con tu proyecto adentro: pegalo en el archivo del repo de GitHub del proyecto y al abrirlo arranca con todo cargado, sin necesidad del .json. El nombre del proyecto nombra los archivos.</div>
                  <div className="tools"><Btn icon="trash" kind="danger" onClick={newProject}>Nuevo proyecto (vaciar)</Btn></div>
                  {projectLoadError && <div className="err">{projectLoadError}</div>}
                </Group>
                <Group id="exp" title="Exportar">
                  <div className="tools">
                    <Btn icon="export" kind="acc" onClick={downloadFullHtml}>index.html</Btn>
                    <Btn icon="copy" onClick={copyFullHtml}>Copiar index.html</Btn>
                  </div>
                </Group>
                <Group id="vid" title="Video para redes (MP4)">
                  <Seg value={vidFormat} onChange={setVidFormat} options={[["story", "Historias - Reel 9:16"], ["feed", "Feed 4:5"]]} />
                  {vidFormat === "feed" && <Slider label="Encuadre vertical %" min={0} max={100} step={1} value={vidCropY} onChange={setVidCropY} />}
                  <Slider label="Duracion (s)" min={3} max={60} step={1} value={vidSeconds} onChange={setVidSeconds} />
                  <Seg value={vidFps} onChange={setVidFps} options={[[30, "30 fps"], [60, "60 fps"]]} />
                  <Seg value={vidQuality} onChange={setVidQuality} options={[[1, "Calidad normal"], [2, "Alta (2x, mas lento)"]]} />
                  <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>
                    {VIDEO_FORMATS[vidFormat].w}x{VIDEO_FORMATS[vidFormat].h}.{vidFormat === "feed" ? " Se arma con la misma composicion del marco 9:16 (el logo mide igual) y se recorta en alto: 0% = pegado arriba (zona libre), 100% = pegado abajo." : ""} Recorre el scroll de 0 a 100% y graba solo el canvas (sin barra de progreso ni aviso de scroll). Deja la pestana visible mientras exporta.
                  </div>
                  <div className="tools"><Btn icon="play" kind="acc" onClick={startVideoExport} disabled={vidRun && vidRun.status === "running"}>Exportar MP4</Btn></div>
                </Group>
                <Group id="code" title="Código" defaultOpen={false}>
                  {[["Huesos", boneCode, "bones"], ["Cámara", scenesCode, "camera"], ["Movimiento", movementCode, "movement"], ["Objetos", objectsCode, "objects"]].map(([t, code, k]) => (
                    <div key={k} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <div className="tools"><span className="lbl">{t}</span><Btn icon="copy" onClick={() => copy(code, k)}>Copiar</Btn></div>
                      <textarea className="code" readOnly value={code} onFocus={(e) => e.target.select()} />
                    </div>
                  ))}
                </Group>
              </>
            )}
          </div>
          {toast && <div className="toast">{toast}</div>}
          {vidRun && (
            <div className="vx-overlay">
              <div className="vx-card">
                <h3>{vidRun.status === "running" ? "Exportando video..." : vidRun.status === "done" ? "Video listo" : "No se pudo exportar"}</h3>
                <canvas ref={vidPreviewRef} width={216} height={384} style={{ display: vidRun.status === "error" ? "none" : "block" }} />
                {vidRun.status !== "error" && <div className="vx-bar"><i style={{ width: Math.round(vidRun.pct * 100) + "%" }} /></div>}
                <div className={vidRun.status === "error" ? "err" : "vx-msg"}>{vidRun.msg}</div>
                {vidRun.status === "running"
                  ? <Btn kind="danger" onClick={() => { vidCancelRef.current = true; }}>Cancelar</Btn>
                  : <Btn kind="acc" onClick={() => setVidRun(null)}>Cerrar</Btn>}
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>

<script>
/* Arranque del editor: el código del editor comparte con la plantilla del sitio
   (bloque tpl-source) las funciones marcadas "//@@use NOMBRE". Acá se arma el
   código completo, se compila con Babel y se ejecuta como módulo. */
(function () {
  var tpl = document.getElementById("tpl-source").value;
  var DEF = /^(?:function\s+([A-Za-z_]\w*)|const\s+([A-Za-z_]\w*)\s*=)/gm, defs = [], m;
  while ((m = DEF.exec(tpl))) defs.push({ n: m[1] || m[2], i: m.index });
  var blocks = {};
  for (var k = 0; k < defs.length; k++) {
    var e = k + 1 < defs.length ? defs[k + 1].i : tpl.length;
    blocks[defs[k].n] = (defs[k].n in blocks) ? null : tpl.slice(defs[k].i, e);
  }
  var code = document.getElementById("editor-src").textContent.replace(/^\/\/@@use (\w+)\n/gm, function (_, n) {
    if (!blocks[n]) throw new Error("Bloque compartido no encontrado: " + n);
    return blocks[n];
  });
  var out = Babel.transform(code, { presets: ["react"], sourceType: "module" }).code;
  var el = document.createElement("script");
  el.type = "module"; el.textContent = out; document.body.appendChild(el);
  el.remove(); /* ya quedó en ejecución; así "Guardar como editor" no copia el código compilado */
})();
</script>
</body>
