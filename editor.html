<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weeb Scene</title>
<style>
  :root { --bg0:#0a0c11; --bg1:#10131a; --bg2:#171b25; --line:#212736; --line2:#2e364a; --tx:#e6e9f0; --tx2:#8790a5; --acc:#49d3ff; --danger:#ff6b7d; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg0); height:100%; overflow:hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--tx); }
  body.dragging { cursor: ew-resize; user-select: none; }
  #root { width:100%; height:100%; display:flex; }
  .viewport { flex:1; position:relative; min-width:0; }
  canvas { display:block; }
  .grow { flex:1; }

  /* viewport overlays */
  .vp-bar { position:absolute; top:10px; left:10px; z-index:5; display:flex; gap:4px; flex-wrap:wrap; }
  .vchip { padding:4px 9px; font-size:11px; border-radius:6px; cursor:pointer; user-select:none; color:var(--tx2); background:rgba(10,12,17,.75); border:1px solid var(--line2); backdrop-filter:blur(6px); }
  .vchip.on { color:#04212b; background:var(--acc); border-color:var(--acc); font-weight:600; }
  .vp-hud { position:absolute; left:10px; bottom:10px; z-index:5; font:600 11px ui-monospace, Menlo, monospace; color:var(--acc); background:rgba(10,12,17,.75); border:1px solid var(--line2); padding:4px 9px; border-radius:6px; }
  .mk { pointer-events:none; white-space:nowrap; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:10px; color:#0a0c11; background:var(--oc); opacity:.85; transform:translateY(-4px); }
  .mk.sel { opacity:1; box-shadow:0 0 0 2px #fff; }
  .mobile-frame { position:absolute; top:0; left:0; pointer-events:none; z-index:4; border:1.5px solid var(--acc); box-shadow:0 0 0 2000px rgba(0,0,0,.45); border-radius:14px; }
  .scene-box { position:absolute; inset:0; }
  /* ---- Loader: SVG que se dibuja + contador 000 → 100 + zoom de salida ---- */
  .ldr { position: fixed; inset: 0; z-index: 100; touch-action: none; overflow: hidden; }
  .ldr--contained { position: absolute; z-index: 30; cursor: pointer; }
  .ldr__bg { position: absolute; inset: 0; background: var(--ldr-bg, #05070f); }
  .ldr__stage { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: grid; place-items: center; }
  .ldr__zoom { width: min(64vw, 420px, calc(46vh * var(--ar, 1))); aspect-ratio: var(--ar, 1); transform-origin: 50% 50%; }
  .ldr__zoom svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .ldr__num { position: absolute; left: 0; right: 0; bottom: 10%; text-align: center; color: var(--ldr-line, #fff); user-select: none;
    font-family: var(--ldr-font, 'Space Grotesk', system-ui, sans-serif); font-weight: 300; font-size: clamp(60px, 8vw, 104px); line-height: 1; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .vp-trail { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; mix-blend-mode:screen; }
  .vp-rail { position:absolute; top:50%; transform:translateY(-50%); height:28%; width:2px; z-index:6; background:rgba(244,241,234,.15); border-radius:2px; overflow:hidden; pointer-events:none; }
  .pg-prev { position:absolute; inset:0; z-index:20; background:var(--bg0); display:flex; flex-direction:column; }
  .pg-bar { display:flex; gap:4px; padding:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pg-scroll { flex:1; overflow:auto; display:flex; justify-content:center; background:#06070b; }
  .pg-frame { width:100%; min-height:100%; background:#0b0b12; }
  .pg-frame.mobile { width:390px; flex:none; align-self:flex-start; margin:18px 0; border:9px solid #232733; border-radius:34px; overflow:hidden; min-height:0; }
  .pg-blk { position:relative; cursor:pointer; }
  .pg-blk:hover::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 2px rgba(73,211,255,.35); pointer-events:none; z-index:5; }
  .pg-blk.sel::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 3px var(--acc); pointer-events:none; z-index:5; }
  .pg-list { display:flex; flex-direction:column; gap:4px; }
  .pg-row { display:flex; align-items:center; gap:4px; padding:5px 6px; border:1px solid var(--line2); border-radius:7px; background:var(--bg2); cursor:pointer; }
  .pg-row.on { border-color:var(--acc); background:#10242c; }
  .pg-row.is3d { border-style:dashed; }
  .pg-n { width:18px; text-align:center; color:var(--tx2); font:600 10.5px ui-monospace, Menlo, monospace; }
  .pg-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vp-rail i { position:absolute; bottom:0; left:0; width:100%; background:var(--rail-color, #49d3ff); border-radius:2px; }
  .mobile-frame__label { position:absolute; top:-22px; left:0; font-size:10.5px; color:var(--acc); background:rgba(10,12,17,.75); padding:2px 6px; border-radius:4px; white-space:nowrap; }

  /* panel */
  .panel { width:470px; height:100%; display:flex; background:var(--bg1); border-left:1px solid var(--line); font-size:12px; }
  .rail { width:58px; flex:none; background:var(--bg0); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:6px 0; gap:2px; }
  .rail-btn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px; background:none; border:0; border-left:2px solid transparent; color:var(--tx2); cursor:pointer; font-size:9.5px; letter-spacing:.03em; }
  .rail-btn:hover { color:var(--tx); background:var(--bg2); }
  .rail-btn.on { color:var(--acc); border-left-color:var(--acc); background:var(--bg1); }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  .topbar { display:flex; align-items:center; gap:4px; padding:7px 10px; border-bottom:1px solid var(--line); }
  .brand { font:700 11px ui-monospace, Menlo, monospace; letter-spacing:.14em; color:var(--tx2); }
  .brand b { color:var(--acc); }
  .stagebar { padding:8px 10px; border-bottom:1px solid var(--line); background:var(--bg1); display:flex; flex-direction:column; gap:6px; }
  .stage-row { display:flex; align-items:center; gap:4px; }
  .chips { flex:1; display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; padding:1px; }
  .chips::-webkit-scrollbar { display:none; }
  .stage-cur { min-width:74px; padding:0 8px; }
  .stage-track { position:relative; flex:1; height:26px; background:var(--bg2); border:1px solid var(--line2); border-radius:5px; margin:0 3px; }
  .stage-track i { position:absolute; top:4px; width:6px; height:16px; margin-left:-3px; border-radius:2px; background:var(--tx2); cursor:pointer; opacity:.7; }
  .stage-track i:hover { opacity:1; background:var(--tx); }
  .stage-track i.on { background:var(--acc); opacity:1; top:2px; height:20px; width:8px; margin-left:-4px; }
  .stagelist { border:1px solid var(--line2); border-radius:8px; background:var(--bg2); display:flex; flex-direction:column; gap:4px; padding:6px; }
  .stagelist input { width:100%; box-sizing:border-box; }
  .stagelist-body { max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .srow { display:flex; align-items:center; gap:7px; padding:3px 4px 3px 6px; border-radius:5px; cursor:pointer; border:1px solid transparent; font-size:11.5px; }
  .srow:hover { border-color:var(--line2); }
  .srow.on { background:color-mix(in srgb, var(--acc) 16%, var(--bg2)); border-color:var(--acc); }
  .srow .sn { flex:none; width:22px; color:var(--tx2); font:600 10.5px ui-monospace, Menlo, monospace; text-align:right; }
  .srow .sname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .sp { flex:none; color:var(--tx2); font:10.5px ui-monospace, Menlo, monospace; }
  .lookgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .lookcard { text-align:left; padding:8px 9px; border-radius:8px; cursor:pointer; background:var(--bg2); border:1px solid var(--line2); color:var(--tx); display:flex; flex-direction:column; gap:3px; font:inherit; }
  .lookcard:hover { border-color:var(--acc); }
  .lookcard.on { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 14%, var(--bg2)); }
  .lookcard b { font-size:11.5px; }
  .lookcard span { font-size:10px; color:var(--tx2); line-height:1.3; }
  .chip { flex:none; min-width:26px; height:26px; padding:0 6px; border-radius:5px; cursor:pointer; background:var(--bg2); border:1px solid var(--line2); color:var(--tx2); font:600 11px ui-monospace, Menlo, monospace; }
  .chip:hover { color:var(--tx); }
  .chip.on { background:var(--acc); color:#04212b; border-color:var(--acc); }
  .stage-name { flex:1; }
  .stage-meta { font:11px ui-monospace, Menlo, monospace; color:var(--tx2); }
  .content { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .content::-webkit-scrollbar { width:8px; } .content::-webkit-scrollbar-thumb { background:var(--line2); border-radius:4px; }

  /* controles */
  .ibtn { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; flex:none; border-radius:6px; cursor:pointer; color:var(--tx2); background:var(--bg2); border:1px solid var(--line2); padding:0; }
  .ibtn:hover:not(:disabled) { color:var(--tx); border-color:var(--tx2); }
  .ibtn:disabled { opacity:.35; cursor:default; }
  .ibtn.acc { color:var(--acc); border-color:var(--acc); }
  .ibtn.danger:hover:not(:disabled) { color:var(--danger); border-color:var(--danger); }
  .mini { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; flex:none; background:none; border:0; border-radius:4px; color:var(--tx2); cursor:pointer; padding:0; }
  .mini:hover { color:var(--tx); background:var(--bg2); }
  .mini.danger:hover { color:var(--danger); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:11.5px; color:var(--tx); background:var(--bg2); border:1px solid var(--line2); }
  .btn:hover:not(:disabled) { border-color:var(--tx2); }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.acc { background:var(--acc); color:#04212b; border-color:var(--acc); font-weight:600; }
  .btn.danger { color:var(--danger); border-color:rgba(255,107,125,.4); }
  .tools { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=time], input[type=number], select, textarea { background:var(--bg0); color:var(--tx); border:1px solid var(--line2); border-radius:5px; padding:5px 7px; font:12px system-ui, sans-serif; min-width:0; }
  input[type=text]:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
  select option { background:var(--bg1); }
  input[type=color] { width:30px; height:22px; padding:0; border:1px solid var(--line2); border-radius:4px; background:none; cursor:pointer; }
  input[type=file] { display:none; }
  .row { display:flex; align-items:center; gap:8px; min-height:26px; }
  .lbl { width:58px; flex:none; color:var(--tx2); font-size:11px; }
  .hex { font:11px ui-monospace, Menlo, monospace; color:var(--tx2); }
  .path { flex:1; font-family: ui-monospace, Menlo, monospace !important; font-size:11px !important; }
  .num { display:flex; align-items:center; background:var(--bg0); border:1px solid var(--line2); border-radius:5px; height:24px; overflow:hidden; min-width:0; }
  .num:focus-within { border-color:var(--acc); }
  .num-l { padding:0 6px; height:100%; display:flex; align-items:center; font:700 10px ui-monospace, Menlo, monospace; cursor:ew-resize; user-select:none; background:var(--bg2); }
  .num input { width:100%; min-width:0; border:0; background:none; color:var(--tx); font:11.5px ui-monospace, Menlo, monospace; padding:0 6px; height:100%; text-align:right; }
  .num input:focus { outline:none; }
  .row > .num { width:64px; flex:none; }
  .vec3 { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; }
  .vec3 .num { width:auto; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:16px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:3px; border-radius:2px; background:linear-gradient(to right, var(--acc) var(--pct,0%), var(--line2) var(--pct,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px; margin-top:-4px; border-radius:50%; background:#fff; border:2px solid var(--acc); }
  input[type=range]::-moz-range-track { height:3px; background:var(--line2); }
  input[type=range]::-moz-range-progress { height:3px; background:var(--acc); }
  input[type=range]::-moz-range-thumb { width:9px; height:9px; border-radius:50%; background:#fff; border:2px solid var(--acc); }
  .sw { display:inline-flex; align-items:center; cursor:pointer; }
  .sw input { display:none; }
  .sw-track { width:28px; height:15px; border-radius:8px; background:var(--line2); position:relative; transition:.15s; }
  .sw-track::after { content:""; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:#fff; transition:.15s; }
  .sw input:checked + .sw-track { background:var(--acc); }
  .sw input:checked + .sw-track::after { left:15px; }
  .sw-txt { margin-left:7px; font-size:11.5px; }
  .seg { display:flex; background:var(--bg0); border:1px solid var(--line2); border-radius:6px; overflow:hidden; }
  .seg button { flex:1; padding:5px 6px; font-size:11px; border:0; background:none; color:var(--tx2); cursor:pointer; }
  .seg button.on { background:var(--acc); color:#04212b; font-weight:600; }
  .pre { display:flex; gap:4px; flex-wrap:wrap; margin-left:66px; }
  .pre button { padding:3px 8px; font-size:10.5px; border-radius:10px; border:1px solid var(--line2); background:none; color:var(--tx2); cursor:pointer; }
  .pre button:hover { color:var(--tx); border-color:var(--tx2); }

  /* grupos */
  .grp { background:var(--bg2); border:1px solid var(--line); border-radius:8px; }
  .grp > header { display:flex; align-items:center; gap:6px; padding:7px 9px; cursor:pointer; user-select:none; }
  .grp .chev { color:var(--tx2); font-size:9px; transition:.15s; }
  .grp.open .chev { transform:rotate(90deg); }
  .grp-t { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--tx2); }
  .grp-b { padding:2px 10px 10px; display:flex; flex-direction:column; gap:5px; }

  /* huesos */
  .bone { display:grid; grid-template-columns:86px repeat(3, 1fr) 22px; gap:4px; align-items:center; padding:2px 0 2px 6px; border-left:3px solid var(--line2); }
  .bone.l { border-left-color:#49d3ff; } .bone.r { border-left-color:#ff8cc6; }
  .bone-n { font-size:10.5px; color:var(--tx2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bone.dirty .bone-n { color:var(--tx); font-weight:600; }
  .bone.missing { opacity:.3; }
  .warn { color:#ffb454; font-size:11px; }
  .empty { color:var(--tx2); font-size:11px; text-align:center; padding:14px 0; }

  /* objetos (outliner) */
  .outliner { display:flex; flex-direction:column; gap:3px; }
  .orow { display:flex; align-items:center; gap:7px; padding:5px 6px 5px 8px; border-radius:6px; cursor:pointer; background:var(--bg2); border:1px solid transparent; border-left:4px solid var(--oc); }
  .orow:hover { border-color:var(--line2); border-left-color:var(--oc); }
  .orow.sel { background:color-mix(in srgb, var(--oc) 18%, var(--bg2)); border-color:var(--oc); }
  .orow.off { opacity:.45; }
  .oico { color:var(--oc); display:flex; }
  .oname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .oed { border:1px solid var(--oc); border-top-width:3px; border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:7px; background:var(--bg2); }
  .oed-h { display:flex; align-items:center; gap:8px; }
  .odot { width:10px; height:10px; border-radius:50%; background:var(--oc); flex:none; }
  .oname-in { flex:1; font-weight:600 !important; }
  .tr-n { width:38px; flex:none; font:600 11px ui-monospace, Menlo, monospace; color:var(--acc); }
  .tl { display:flex; height:22px; border-radius:5px; overflow:hidden; gap:2px; }
  .tl div { background:var(--line2); font:600 10px ui-monospace, Menlo, monospace; color:var(--tx2); display:flex; align-items:center; justify-content:center; min-width:16px; }
  .stat { font:11px ui-monospace, Menlo, monospace; color:var(--tx2); }
  textarea.code { width:100%; height:110px; resize:vertical; font:10.5px ui-monospace, Menlo, monospace; color:#9fe3b5; }
  .toast { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:var(--acc); color:#04212b; padding:6px 14px; border-radius:16px; font-weight:600; font-size:11.5px; z-index:20; }
  .err { color:var(--danger); font-size:11px; }
  .vx-overlay { position:fixed; inset:0; z-index:99999; background:rgba(6,8,12,.96); display:flex; align-items:center; justify-content:center; }
  .vx-card { width:min(380px, 92vw); display:flex; flex-direction:column; gap:12px; align-items:center; padding:20px; background:var(--bg1); border:1px solid var(--line2); border-radius:12px; }
  .vx-card h3 { margin:0; font-size:15px; }
  .vx-card canvas { background:#000; border:1px solid var(--line2); border-radius:6px; max-width:100%; max-height:52vh; }
  .vx-bar { width:100%; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .vx-bar i { display:block; height:100%; background:var(--acc); width:0; }
  .vx-msg { font:11px ui-monospace, Menlo, monospace; color:var(--tx2); text-align:center; line-height:1.5; }
</style>

<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap"

<style>
  :root {
    --brand-accent: #49d3ff;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #ffffff8a;
    --color-text-muted: rgba(244, 241, 234, 0.6);
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
  }
  /* html recorta el desborde horizontal; body usa "clip" (NO crea un contenedor de scroll, así el escenario 3D "pegado" (sticky) funciona). */
  html { overflow-x: hidden; }
  body { overflow-x: hidden; overflow-x: clip; }

  @media (min-width: 769px) and (pointer: fine) {
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  .canvas-stage {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    height: 100lvh;
    contain: paint;
    background: #05070a;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;

<script>
  /* Scroll con inercia (Lenis). No requiere tocar el resto del código:
     Lenis intercepta la rueda/touch y anima window.scrollTo() de forma
     suave, disparando eventos "scroll" nativos igual que siempre — así
     que useScrollProgress() sigue funcionando sin cambios, solo que
     ahora el movimiento llega amortiguado en vez de "a saltos". */
  (function () {
    if (typeof Lenis === "undefined") return;
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false, // en mobile el scroll táctil nativo se siente mejor
    });
    function raf(time) {
      if (window.__lenis) window.__lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    window.__lenis = lenis; // por si algún otro script necesita pausarlo/reanudarlo
  })();
</script>

      const B = wsBlock() || { mf: 0, mt: 1 };
      const bspan = Math.max(1e-6, B.mt - B.mf);
      const marks = scenes.map((s) => s.progress).filter((m) => m >= B.mf - 1e-4 && m <= B.mt + 1e-4).map((m) => (m - B.mf) / bspan);
      if (marks.length < 2) return;
      const cur = (useScrollStore.getState().progress - B.mf) / bspan;
      let i = 0; let best = 1e9;
      marks.forEach((m, k) => { const d = Math.abs(m - cur); if (d < best) { best = d; i = k; } });
      const dir = dy < 0 ? 1 : -1;
      let j = i + dir;
      if (dir > 0 && marks[i] > cur + 0.002) j = i;            // estaba antes de la pose más cercana: ir a esa
      if (dir < 0 && marks[i] < cur - 0.002) j = i;
      if (j < 0 || j > marks.length - 1) {
        /* Último / primer paso del 3D: seguir hacia la sección 2D de abajo / de arriba (si existe). */
        const topPx = window.__wsScrollTop || 0, vh = window.innerHeight;
        const maxY = Math.max(0, document.documentElement.scrollHeight - vh);
        if (dir > 0 && topPx + total >= maxY - 4) return;
        if (dir < 0 && topPx <= 4) return;
        busyUntil = now + 900;
        const to = Math.max(0, Math.min(maxY, dir > 0 ? topPx + total + vh * 0.9 : topPx - vh * 0.9));
        const eo = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        if (window.__lenis && window.__lenis.scrollTo) window.__lenis.scrollTo(to, { duration: 1.1, easing: eo, force: true });
        else window.scrollTo({ top: to, behavior: "smooth" });
        return;
      }
      j = Math.max(0, Math.min(marks.length - 1, j));
      if (j === i && Math.abs(marks[i] - cur) < 0.002) return;
      const span = Math.abs(marks[j] - cur) * bspan * SCROLL_LENGTH_VH;
      const avg = bspan * SCROLL_LENGTH_VH / Math.max(1, marks.length - 1);
      const dur = Math.max(0.8, Math.min(2.6, 1.3 * span / avg));
      busyUntil = now + dur * 1000 * 0.85;
      const target = (window.__wsScrollTop || 0) + marks[j] * total;
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      if (window.__lenis && window.__lenis.scrollTo) window.__lenis.scrollTo(target, { duration: dur, easing: ease, force: true });
      else window.scrollTo({ top: target, behavior: "smooth" });
    };
    window.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd, { passive: true });
    return () => {
      window.removeEventListener("touchstart", onStart);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onEnd);
    };
  }, []);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  const started = useRef(false);
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    // al abrir la página ya scrolleada (recarga) se salta directo, sin "viajar" por todas las poses
    if (!started.current) { started.current = true; if (progress > 0) { setSmoothProgress(progress); window.__wsSnap = false; return; } }
    if (window.__wsSnap) { window.__wsSnap = false; if (Math.abs(progress - smoothProgress) > 0.0005) { setSmoothProgress(progress); return; } }
    let next = damp(smoothProgress, progress, IS_TOUCH_DEVICE ? 7 : 4, delta);   // en celular Lenis ya suaviza el dedo: menos doble suavizado = menos "arrastre"
    /* Límite de velocidad: una sacudida fuerte del dedo/rueda ya no hace pasar todo "volando". La imagen avanza como
       mucho SCROLL_MAX_PPS poses por segundo y alcanza al scroll real apenas se frena. 0 = sin límite. */
    if (SCROLL_MAX_PPS > 0) {
      const maxStep = (SCROLL_MAX_PPS * (IS_TOUCH_DEVICE ? 1.6 : 1) * Math.min(delta, 0.1)) / Math.max(1, scenes.length - 1);
      next = smoothProgress + Math.max(-maxStep, Math.min(maxStep, next - smoothProgress));
    }
    setSmoothProgress(next);
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());
  const dampedRoll = useRef(0);
  const dampedFov = useRef(null);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, OBJ_TIGHT ? 16 : 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, OBJ_TIGHT ? 16 : 6, delta);
    camera.position.z = damp(camera.position.z, pz, OBJ_TIGHT ? 16 : 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-(OBJ_TIGHT ? 16 : 6) * delta));
    camera.up.set(0, 1, 0);
    camera.lookAt(currentLookAt.current);

    dampedRoll.current = damp(dampedRoll.current, state.camera.roll || 0, 6, delta);
    if (dampedRoll.current) camera.rotateZ((dampedRoll.current * Math.PI) / 180);

    if ("fov" in camera) {
      if (dampedFov.current == null) dampedFov.current = state.camera.fov;
      dampedFov.current = damp(dampedFov.current, state.camera.fov, 5, delta);
      // El FOV del editor es para el visor 9:16. En un celular más alto que 9:16 (p. ej. 9:20) se abre el campo vertical lo justo
      // para que el ANCHO que se ve sea el mismo: así no se corta el modelo a los costados.
      const k = Math.max(1, 9 / 16 / (camera.aspect || 9 / 16));
      camera.fov = (Math.atan(Math.tan((dampedFov.current * Math.PI) / 360) * k) * 360) / Math.PI;
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

/* ============================================================
   Estela de brillo (sparkle trail) — usada por el personaje
   (bowl1.glb) para dejar un rastro de partículas brillantes a su
   paso, que se van desvaneciendo. Es un sistema de partículas
   simple con THREE.Points + shader propio (glow radial aditivo),
   sin dependencias extra.
   ============================================================ */
const TRAIL_VERTEX_SHADER = `
  attribute float aSize;
  attribute float aOpacity;
  varying float vOpacity;
  void main() {
    vOpacity = aOpacity;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (300.0 / max(-mvPosition.z, 0.001));
    gl_Position = projectionMatrix * mvPosition;
  }
`;
const TRAIL_FRAGMENT_SHADER = `
  uniform vec3 uColor;
  varying float vOpacity;
  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    float d = length(uv) * 2.0;
    float glow = smoothstep(1.0, 0.0, d);
    float core = smoothstep(0.35, 0.0, d);
    float alpha = (glow * glow * 0.6 + core * 0.9) * vOpacity;
    vec3 col = mix(uColor, vec3(1.0), core * 0.6);
    gl_FragColor = vec4(col, alpha);
  }
`;

function SparkleTrail({ anchorRef, enabled, color, size, life, rate }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const particles = useRef([]);
  const maxParticles = useMemo(() => Math.max(8, Math.ceil(rate * life) + 8), [rate, life]);
  const positions = useMemo(() => new Float32Array(maxParticles * 3), [maxParticles]);
  const sizes = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const opacities = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const emitAccum = useRef(0);
  const prevAnchor = useRef(null);
  const prevProgress = useRef(null);
  const { camera: trailCam } = useThree();
  const backV = useMemo(() => new THREE.Vector3(), []);
  const bbox = useMemo(() => ({ box: new THREE.Box3(), c: new THREE.Vector3(), sz: new THREE.Vector3(), r: 0.5, ok: false, n: 0 }), []);

  useEffect(() => {
    if (materialRef.current) materialRef.current.uniforms.uColor.value.set(color);
  }, [color]);

  useFrame((_, delta) => {
    const group = pointsRef.current;
    const anchor = anchorRef && anchorRef.current;
    if (!group) return;

    if (!enabled || !anchor) {
      group.visible = false;
      particles.current.length = 0;
      prevAnchor.current = null;
      prevProgress.current = null;
      return;
    }
    group.visible = true;

    const ax = anchor.position.x, ay = anchor.position.y, az = anchor.position.z;

    // Las chispas se corren hacia "atrás" (alejándose de la cámara) el radio del modelo: así el .glb las tapa cuando la cámara lo ve de frente,
    // sin importar de qué lado del personaje salgan.
    if (!bbox.ok || bbox.n++ % 30 === 0) {
      bbox.box.setFromObject(anchor);
      if (!bbox.box.isEmpty()) { bbox.box.getCenter(bbox.c); bbox.box.getSize(bbox.sz); bbox.r = Math.min(60, Math.max(0.05, bbox.sz.length() * 0.5)); bbox.ok = true; }
    }
    if (bbox.ok) { backV.copy(bbox.c).sub(trailCam.position); if (backV.lengthSq() > 1e-8) backV.normalize().multiplyScalar(bbox.r * 0.8); else backV.set(0, 0, 0); } else backV.set(0, 0, 0);

    // Solo emite si el scroll realmente se movió este frame — filtra el
    // "respirar" idle del personaje, que no cuenta como movimiento real.
    const progress = useScrollStore.getState().smoothProgress;
    const SCROLL_EPS = 2.1 / Math.max(1, SCROLL_LENGTH_VH * 0.01 * window.innerHeight);   // ~2 px de scroll por cuadro, sea cual sea el largo de la página
    const isScrolling = prevProgress.current !== null && Math.abs(progress - prevProgress.current) > SCROLL_EPS;
    prevProgress.current = progress;

    if (isScrolling && prevAnchor.current) {
      emitAccum.current += delta;
      const emitEvery = 1 / Math.max(rate, 1);
      const from = prevAnchor.current;
      while (emitAccum.current >= emitEvery) {
        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length > maxParticles) particles.current.shift();
      }
    } else {
      // Sin scroll: no acumules emisión pendiente, así no larga una
      // ráfaga de golpe apenas el usuario vuelve a mover la rueda.
      emitAccum.current = 0;
    }
    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i >= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age >= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i < n; i++) {
      const p = particles.current[i];
      const t = clamp(p.age / life);
      const drift = t;
      positions[i * 3] = p.x + p.ox * drift + backV.x;
      positions[i * 3 + 1] = p.y + p.oy * drift + t * size * 4 + backV.y;
      positions[i * 3 + 2] = p.z + p.oz * drift + backV.z;
      const twinkle = 0.5 + 0.5 * Math.sin(now * 9 + p.seed * 7);
      opacities[i] = (1 - t) * (1 - t) * (0.35 + 0.65 * twinkle);
      sizes[i] = size * p.sizeMul * (1 - t * 0.35);
    }

    const geom = group.geometry;
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.setDrawRange(0, n);
  });

  return (
    <points key={maxParticles} ref={pointsRef} frustumCulled={false} userData={{ excludeFromReflection: true }}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" count={maxParticles} array={positions} itemSize={3} />
        <bufferAttribute attach="attributes-aSize" count={maxParticles} array={sizes} itemSize={1} />
        <bufferAttribute attach="attributes-aOpacity" count={maxParticles} array={opacities} itemSize={1} />
      </bufferGeometry>
      <shaderMaterial
        ref={materialRef}
        vertexShader={TRAIL_VERTEX_SHADER}
        fragmentShader={TRAIL_FRAGMENT_SHADER}
        uniforms={{ uColor: { value: new THREE.Color(color) } }}
        transparent
        depthWrite={false}
        blending={THREE.AdditiveBlending}
      />
    </points>
  );
}

  /* Cámara de reflejo (cube camera): ubicada en el Modelo principal, cada
   ciertos frames fotografía los 360° a su alrededor (paredes, objetos,
   el PNG del perro, etc. — todo lo que haya en la escena, salvo el
   propio modelo, que se oculta un instante durante la captura) y usa
   esa foto como reflejo en los materiales metálicos del modelo. La
   cámara principal (la que ve el usuario) no necesita apuntar a lo que
   se refleja — el reflejo se calcula aparte, en 360°, todo el tiempo. */
function ReflectionProbe({ anchorRef, enabled, resolution, updateEvery, intensity }) {
  const { gl, scene } = useThree();
  const rtRef = useRef(null);
  const camRef = useRef(null);
  const frameRef = useRef(0);
  const appliedRef = useRef(new Set());
  const posRef = useRef(new THREE.Vector3());
  // Con el rig "Premium producto" el Modelo principal usa el mismo entorno de estudio que los objetos (ver AnimatedCharacter/Character): el probe no lo pisa.
  const studioRig = React.useContext(EnvSettingsCtx).rig === "studio";

  useEffect(() => {
    const rt = new THREE.WebGLCubeRenderTarget(resolution, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
    });
    rtRef.current = rt;
    camRef.current = new THREE.CubeCamera(0.05, 1000, rt);
    appliedRef.current = new Set();
    return () => rt.dispose();
  }, [resolution]);

  useFrame(() => {
    if (studioRig || !enabled || !anchorRef.current || !camRef.current) return;
    frameRef.current++;
    if (frameRef.current % Math.max(1, updateEvery) !== 0) return;

    const anchor = anchorRef.current;
    anchor.getWorldPosition(posRef.current);
    camRef.current.position.copy(posRef.current);

    // Oculta el modelo (para que no se refleje a sí mismo) y también todo lo
    // marcado como "no reflejar" (rayo de luz, estela de chispas) — si no,
    // esos brillos quedan pegados adentro del reflejo aunque estén apagados
    // en pantalla, porque el reflejo los captura igual un instante antes.
    const hidden = [];
    scene.traverse((obj) => {
      if (obj.userData && obj.userData.excludeFromReflection && obj.visible) {
        hidden.push(obj);
        obj.visible = false;
      }
    });
    const wasVisible = anchor.visible;
    anchor.visible = false;
    camRef.current.update(gl, scene);
    anchor.visible = wasVisible;
    hidden.forEach((obj) => { obj.visible = true; });

    const texture = rtRef.current.texture;
    anchor.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        if (!("envMap" in m)) return;
        if (!appliedRef.current.has(m.uuid)) {
          m.envMap = texture;
          m.needsUpdate = true;
          appliedRef.current.add(m.uuid);
        }
        if ("envMapIntensity" in m) m.envMapIntensity = intensity;
      });
    });
  });

  return null;
}

/* ---- Partículas ambientales (polvo en suspensión / bokeh) ----
   Partículas 3D reales (no un overlay): flotan en el espacio, así que tienen parallax
   cuando la cámara se mueve con el scroll. Lo que las hace creíbles:
   - casi todas muy chicas y suaves; pocas más grandes (como el polvo real);
   - profundidad de campo: lejos del plano de foco (el punto al que mira la cámara)
     se agrandan y se apagan, como un bokeh de lente;
   - deriva lenta + vaivén propio + un leve centelleo al "agarrar" la luz;
   - dentro del rayo de luz (si está prendido) se ven más, como el polvo en un haz;
   - tamaño medido en el espacio 3D: se ven igual en cualquier resolución (también en el MP4).
   El movimiento sale de un tiempo, no del frame: en el MP4 se usa el tiempo del video
   (window.__wsExportTime), así el resultado es fluido y repetible. */
const PART_MAX = 3000;
const PART_WHITE = new THREE.Color("#ffffff");
const PART_VERT = `
  attribute vec4 aA;
  attribute vec4 aB;
  uniform float uTime;
  uniform vec3 uCenter;
  uniform vec3 uBox;
  uniform float uSize;
  uniform float uBlur;
  uniform float uFocus;
  uniform float uScale;
  uniform float uOpacity;
  uniform float uPxH;
  uniform vec3 uBeamO;
  uniform vec3 uBeamD;
  uniform float uBeamR;
  uniform float uBeamL;
  uniform float uBeamBoost;
  varying vec2 vUv;
  varying float vAlpha;
  varying float vSoft;
  void main() {
    float t = uTime;
    vec3 p = aA.xyz * uBox;
    vec3 drift = vec3(0.018 + 0.026 * aB.z, 0.010 + 0.018 * aB.w, -0.008) * t;
    vec3 wob = vec3(sin(t * 0.31 * aB.y + aB.x * 6.2831), sin(t * 0.23 * aB.y + aB.x * 11.0), sin(t * 0.27 * aB.y + aB.x * 15.0)) * 0.16;
    vec3 rel = mod(p + drift + wob - uCenter + uBox * 0.5, uBox) - uBox * 0.5;
    vec3 world = uCenter + rel;
    vec4 mv = viewMatrix * vec4(world, 1.0);
    float depth = max(-mv.z, 0.001);

    float rs = fract(aA.w * 37.0);
    float big = step(0.9, aA.w);
    float phys = 0.012 * uScale * uSize * mix(0.7 + 0.9 * rs, 2.5 + 2.0 * rs, big);
    float coc = uBlur * 0.045 * max(abs(depth - uFocus) - 0.7, 0.0);
    float sz = phys + coc;
    float blurK = coc / sz;
    float energy = clamp(pow(phys / sz, 0.75) * 1.6, 0.0, 1.0);
    // tamaño mínimo en pantalla: una mota de menos de ~2 px se agranda y se atenúa (misma energía),
    // así no desaparece en el visor del editor ni en pantallas chicas
    float px = sz * projectionMatrix[1][1] / depth * uPxH * 0.5;
    float minPx = 2.2;
    float grow = max(1.0, minPx / max(px, 0.0001));
    sz *= grow;
    energy /= grow;
    float lum = 0.25 + 0.75 * pow(fract(aA.w * 131.7), 2.0);

    vec3 q = abs(rel) / (uBox * 0.5);
    float edge = (1.0 - smoothstep(0.7, 1.0, q.x)) * (1.0 - smoothstep(0.7, 1.0, q.y)) * (1.0 - smoothstep(0.7, 1.0, q.z));
    float nearF = smoothstep(0.3, 1.2, depth);
    float tw = 0.45 + 0.55 * pow(0.5 + 0.5 * sin(uTime * aB.y * 1.3 + aB.x * 6.2831), 2.0);

    vec3 rb = world - uBeamO;
    float along = dot(rb, uBeamD);
    float dist = length(rb - uBeamD * along);
    float rr = dist / max(uBeamR, 0.001);
    float shaft = exp(-rr * rr * 1.5) * smoothstep(-0.3, 0.8, along) * (1.0 - smoothstep(uBeamL * 0.8, uBeamL, along));
    float vis = mix(1.0, 0.3 + 2.4 * shaft, uBeamBoost);

    vAlpha = uOpacity * energy * lum * edge * nearF * tw * vis;
    vSoft = mix(0.8, 0.5, blurK);
    vUv = position.xy * 2.0;
    mv.xy += position.xy * sz;
    gl_Position = projectionMatrix * mv;
  }
`;
const PART_FRAG = `
  uniform vec3 uColor;
  varying vec2 vUv;
  varying float vAlpha;
  varying float vSoft;
  void main() {
    float r = length(vUv);
    float e = 1.0 - smoothstep(1.0 - vSoft, 1.0, r);
    gl_FragColor = vec4(uColor, e * vAlpha);
    #include <colorspace_fragment>
  }
`;
function makePartGeometry() {
  const g = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
  const A = new Float32Array(PART_MAX * 4), B = new Float32Array(PART_MAX * 4);
  let s = 1234567;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i = 0; i < PART_MAX; i++) {
    A[i * 4] = rnd(); A[i * 4 + 1] = rnd(); A[i * 4 + 2] = rnd(); A[i * 4 + 3] = rnd();
    B[i * 4] = rnd(); B[i * 4 + 1] = 0.5 + rnd() * 1.1; B[i * 4 + 2] = rnd() * 2 - 1; B[i * 4 + 3] = rnd() * 2 - 1;
  }
  g.setAttribute("aA", new THREE.InstancedBufferAttribute(A, 4));
  g.setAttribute("aB", new THREE.InstancedBufferAttribute(B, 4));
  g.instanceCount = 650;
  return g;
}
function AmbientParticles({ enabled, count, size, opacity, speed, blur, range, beam, beamWidth, beamHeight, beamTarget, getLight, getLookAt }) {
  const meshRef = useRef(null);
  const geom = useMemo(() => makePartGeometry(), []);
  const mat = useMemo(() => new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uCenter: { value: new THREE.Vector3() }, uBox: { value: new THREE.Vector3(16, 10, 16) },

/* ---- Rayo de luz (volumétrico falso) ----
   Antes eran 3 planos cruzados: de frente o desde abajo se veían como una
   estrella de líneas y el final cortaba recto. Ahora es UN solo plano que
   gira alrededor del eje del rayo para mirar siempre a la cámara
   ("billboard cilíndrico"), con perfil suave (gaussiano) a los costados y
   un difuminado regulable en la punta. Si se mira justo de frente al rayo
   el plano se va apagando y lo reemplaza un halo redondo en el punto final.
   El final del rayo ("destino") se puede mover en X / altura / Z. */
const BEAM_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const BEAM_BODY_FRAG = `
  uniform vec3 uColor;
  uniform float uOpacity;
  uniform float uSoftFrac;
  uniform float uFacing;
  varying vec2 vUv;
  void main() {
    float x = (vUv.x - 0.5) * 2.0;
    float side = max(0.0, (exp(-x * x * 3.4) - 0.033) / 0.967);
    float v = vUv.y;
    float tip = smoothstep(0.0, uSoftFrac, v);
    float src = 1.0 - smoothstep(0.78, 1.0, v);
    float a = side * tip * src * uOpacity * uFacing;
    gl_FragColor = vec4(uColor, a);
    #include <colorspace_fragment>
  }
`;
const BEAM_GLOW_FRAG = `
  uniform vec3 uColor;
  uniform float uAlpha;
  varying vec2 vUv;
  void main() {
    vec2 p = (vUv - 0.5) * 2.0;
    float g = max(0.0, (exp(-dot(p, p) * 4.5) - 0.011) / 0.989);
    gl_FragColor = vec4(uColor, g * uAlpha);

const BEAM_GAIN = 2.4;
function LightBeamCore({ enabled, opacity, width, height, soft, glow, target, getLight }) {
  const groupRef = useRef(null);
  const bodyRef = useRef(null);
  const glowRef = useRef(null);
  const bodyMat = useMemo(() => makeBeamMaterial(BEAM_BODY_FRAG, {
    uColor: { value: new THREE.Color("#ffffff") }, uOpacity: { value: 0.5 }, uSoftFrac: { value: 0.4 }, uFacing: { value: 1 },
  }), []);
  const glowMat = useMemo(() => makeBeamMaterial(BEAM_GLOW_FRAG, {
    uColor: { value: new THREE.Color("#ffffff") }, uAlpha: { value: 0 },
  }), []);
  useEffect(() => () => { bodyMat.dispose(); glowMat.dispose(); }, [bodyMat, glowMat]);
  const tmp = useMemo(() => ({ dir: new THREE.Vector3(), cam: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0) }), []);

  useFrame(({ camera }) => {
    const g = groupRef.current, body = bodyRef.current;
    if (!enabled || !g || !body) return;
    const L = getLight();
    const d = lightDirFromAngles(L.azimuth ?? 45, L.elevation ?? 35, 1);
    tmp.dir.set(d[0], d[1], d[2]).normalize();
    const tx = target ? target[0] : 0, ty = target ? target[1] : 0, tz = target ? target[2] : 0;
    // El rayo nace en el destino y se estira "height" hacia la luz.
    g.position.set(tx + tmp.dir.x * height * 0.5, ty + tmp.dir.y * height * 0.5, tz + tmp.dir.z * height * 0.5);
    g.quaternion.setFromUnitVectors(tmp.up, tmp.dir);
    g.updateMatrixWorld(true);

    tmp.cam.copy(camera.position);
    g.worldToLocal(tmp.cam);
    const len = tmp.cam.length() || 1;
    body.rotation.y = Math.atan2(tmp.cam.x, tmp.cam.z);
    // De frente al rayo (mirando a lo largo del eje) el plano queda de canto: se apaga.
    const perp = Math.hypot(tmp.cam.x, tmp.cam.z) / len;
    const facing = THREE.MathUtils.smoothstep(perp, 0.04, 0.4);
    const softFrac = THREE.MathUtils.clamp((soft ?? 0.5) * (width * 1.2 + height * 0.3) / Math.max(height, 0.001), 0.03, 1);
    const bu = bodyMat.uniforms;
    bu.uColor.value.set(L.color || "#ffffff");
    bu.uOpacity.value = opacity * BEAM_GAIN;

    bu.uFacing.value = facing;

      gl.position.set(tx, ty, tz);
      gl.quaternion.copy(camera.quaternion);

  return (
    <group userData={{ excludeFromReflection: true }}>
      <group ref={groupRef}>
        <mesh ref={bodyRef} material={bodyMat} frustumCulled={false}>
          <planeGeometry args={[width, height]} />
        </mesh>
      </group>
      {(glow ?? 0.35) > 0 && (
        <mesh ref={glowRef} material={glowMat} frustumCulled={false}>
          <planeGeometry args={[1, 1]} />
        </mesh>
      )}
    </group>
  );

  );

/* Guardia de "pantalla negra": en algunas GPU de celular un efecto (oclusión ambiental, MSAA con postproceso, etc.) deja TODO lo 3D negro.

function BlackFrameGuard({ active, renderDirect, onBlack, onOk }) {
  const gl = useThree((st) => st.gl);
  const st = useRef({ n: 0, bad: 0, ok: 0, wait: 0, done: false });
  const buf = useMemo(() => new Uint8Array(4), []);
  useFrame(({ gl: g, scene, camera }) => {
    // OJO: cualquier useFrame con prioridad > 0 le saca a R3F el dibujado automático. Si no hay postproceso (EffectComposer) que dibuje,
    // se dibuja acá, igual que lo haría R3F.
    if (renderDirect) g.render(scene, camera);
    const s2 = st.current;
    if (!active || s2.done) return;
    s2.n++;
    if (s2.wait > 0) { s2.wait--; return; }
    if (s2.n % 10 !== 0) return;
    try {
      const ctx = gl.getContext(); const cv = gl.domElement; const W = cv.width, H = cv.height;

      for (let i = 1; i <= 5; i++) for (let j = 1; j <= 5; j++) {

        if (buf[3] > 200) { covered++; if (buf[0] + buf[1] + buf[2] < 24) dark++; }

      const black = covered >= 4 && dark / covered >= 0.85;
      if (black) { s2.bad++; s2.ok = 0; } else { s2.ok++; s2.bad = 0; }

    } catch (e) { s2.done = true; }
  }, 3);
  return null;
}

  useEffect(() => {

  useFrame(() => {

function SceneText() {
  const refs = useRef([]);
  const charRefsByScene = useRef(scenes.map(() => []));

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight > 0 ? 1 : 0); // el contenedor solo controla visibilidad/posición del bloque
        el.style.transform =
          kf.text.align === "center"

            : `translateY(${(1 - weight) * 10}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";

        // Reveal en cascada por caracter (tipografía cinética)
        const chars = charRefsByScene.current[i];
        if (chars && chars.length) {
          const stagger = 0.6; // qué tan "esparcida" queda la cascada entre el primer y el último caracter
          const n = chars.length;
          chars.forEach((cel, j) => {
            if (!cel) return;
            const localW = clamp(weight * (1 + stagger) - (j / n) * stagger);
            cel.style.opacity = String(localW);
            cel.style.transform = `translateY(${(1 - localW) * 14}px)`;
            cel.style.filter = `blur(${(1 - localW) * 3}px)`;
          });
        }
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{renderKineticTitle(kf.text.title, charRefsByScene.current[i])}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

    const io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) vis.add(e.target); else vis.delete(e.target); }); setInView(vis.size > 0); }, { rootMargin: IS_TOUCH_DEVICE ? "900px 0px" : "240px 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  useEffect(() => {
    if (!LOADER.enabled) { const p = document.getElementById("pre-ldr"); if (p) p.remove(); }
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className={"app-root" + (PHONE_COLUMN ? " app-root--col" : "")}

        "--font-body": clientConfig.fonts.body,
      }}
    >
      {LOADER.enabled && <LoaderOverlay cfg={LOADER} />}
      {SECTIONS.some((x) => x.type !== "scene3d") && <style>{S2D_CSS}</style>}
      {ovlFold(SECTIONS.map((sec) => sec.type === "scene3d" ? (
        <div key={sec.id} id={sec.anchor || ("sec-" + sec.id)} className="scroll-spacer ws-3d" style={{ height: `${blk3d(sec).vh}vh`, "--sl": `${blk3d(sec).vh}vh` }}>
      {blk3d(sec).first && <div ref={stageRef} className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <div className="scene-canvas">
          <Canvas
            dpr={device.dpr}
            shadows="soft"
            gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}
            camera={{ position: [0, 0.2, 6.5], fov: 35, near: CAM_NEAR, far: 1000 }}
          >
            <FrameGate active={inView} />
            <Experience device={device} />
          </Canvas>
        </div>
        <BackgroundGradient stageRef={stageRef} />
        {HALO > 0 && <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 2, pointerEvents: "none", background: `radial-gradient(ellipse 75% 48% at 20% 0%, ${accentHalo(ACCENT, HALO)[0]} 0%, ${accentHalo(ACCENT, HALO)[1]} 42%, rgba(0,0,0,0) 74%)` }} />}
        {labVig && (
          <div
            aria-hidden="true"
            style={{
              position: "absolute",
              inset: 0,
              zIndex: 3,
              pointerEvents: "none",
              background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - labVigO) * 100}%, rgba(0,0,0,${labVigD}) 100%)`,
            }}
          />
        )}
        {CURSOR.enabled && !IS_TOUCH_DEVICE && <CursorTrail />}
        <SceneText />
        <ProgressIndicator />
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>}
        </div>
      ) : <Block2D key={sec.id} s={sec} theme={SITE2D} />), SECTIONS)}
      {BACKTOP.enabled && <BackToTop />}
      {MENU.logoUrl && <SiteLogo cfg={MENU} />}
      {MENU.enabled && <SiteMenu cfg={MENU} />}
      {LAB_ON && <LabPanel />}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

const BONE_DEFS = [

const BONE_KEYS = BONE_DEFS.map(([k]) => k);

const rad = (d) => (d * Math.PI) / 180;

const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));

function smoothstep(edge0, edge1, x) {

/* Curva de velocidad ("easing") por tramo — usada por samplePose /

/* Curvas de tiempo de cada tramo entre poses. Las "cinematográficas" son más extremas que las clásicas: arrancan o frenan
   muy lento, o pasan en cámara lenta por el centro, sin tener que agregar más vh. */
function applyEasing(t, kind) {
  switch (kind) {
    case "linear": return t;
    case "easeIn": return t * t;
    case "easeOut": return 1 - (1 - t) * (1 - t);
    case "inOutCubic": return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    case "inOutQuart": return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
    case "inOutQuint": return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
    case "inOutExpo": return t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
    case "inQuart": return t * t * t * t;
    case "inExpo": return t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
    case "outQuart": return 1 - Math.pow(1 - t, 4);
    case "outExpo": return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
    case "slowMid": { const u = 2 * t - 1; return 0.5 + 0.5 * u * u * u; }                 // rápido en los extremos, lento en el centro
    case "slowMidStrong": { const u = 2 * t - 1; return 0.5 + 0.5 * u * u * u * u * u; }   // el centro casi se detiene

    case "outBack": { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    case "inOutBack": { const c1 = 1.2, c2 = c1 * 1.525; return t < 0.5 ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2 : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2; }

/* ============================================================
   Etapas ("poses") — ahora en CANTIDAD VARIABLE. Ya no hay una lista
   fija de 6 nombres semánticos (Frente/Acercamiento/Giro/...); las
   etapas se llaman genéricamente "Pose 1", "Pose 2", etc. y se pueden
   agregar o quitar libremente desde la pestaña Pose/Cámara/Movimiento.
   Pose, Cámara, Movimiento y su Ambiente (luz/niebla/fondo) comparten
   siempre las mismas etapas.
   ============================================================ */
function makeDefaultStages() {
  return [{ id: "pose-1", label: "Pose 1" }];
}
/* Duración de cada tramo (en vh de scroll), entre etapa[i] y etapa[i+1].
   Un valor menos que la cantidad de etapas. La suma de estos valores es
   el largo total del scroll. Editable desde la pestaña "Duración". */
const DEFAULT_DURATIONS_VH = [];

function stagesWithProgress(stageList, durationsVh) {
  const total = durationsVh.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  const out = [{ ...stageList[0], progress: 0 }];
  for (let i = 0; i < durationsVh.length; i++) {
    acc += durationsVh[i];
    out.push({ ...stageList[i + 1], progress: acc / total });
  }
  return out;
}
const roundProgress = (p) => Math.round(p * 1000) / 1000;

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));
const defaultCamera = () => ({ position: [0, 0, 3.5], lookAt: [0, 0.5, 0], fov: 30, roll: 0 });
const defaultMovement = () => ({ pos: [0, 0, 0], yaw: 0, pitch: 0 });
const defaultFx = () => ({
  light: { color: "#dfeeff", intensity: 0.7, azimuth: 45, elevation: 35, rimColor: "#49d3ff", rimIntensity: 1.4, ambient: 0.28 },
  fog: { enabled: true, color: "#05070a", far: 20 },
  background: { mode: "solid", from: "#05070a", to: "#05070a", angle: 180 },
});

/* Todo arranca en cero / neutro: ninguna etapa tiene pose, cámara,
   movimiento ni ambiente predefinidos (salvo el ambiente, que arranca
   con un valor neutro razonable). Se arma a gusto desde la herramienta. */
function initialPoses(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, zeroPose()]));
}
function initialCameras(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultCamera()]));
}
function initialMovements(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultMovement()]));
}
function initialFx(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultFx()]));
}

function samplePose(posesByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return posesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => { out[k] = { x: lerp(pa[k].x, pb[k].x, t), y: lerp(pa[k].y, pb[k].y, t), z: lerp(pa[k].z, pb[k].z, t) }; });

}

function lerpVec3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function sampleCamera(camsByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return camsByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return camsByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ca = camsByKf[a.id], cb = camsByKf[b.id];
  return { position: cb.arc ? lerpOrbit(ca, cb, t) : lerpVec3(ca.position, cb.position, t), lookAt: lerpVec3(ca.lookAt, cb.lookAt, t), fov: lerp(ca.fov, cb.fov, t), roll: lerp(ca.roll || 0, cb.roll || 0, t) };
}

function sampleMovement(movesByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return movesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return movesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ma = movesByKf[a.id], mb = movesByKf[b.id];
  return { pos: lerpVec3(ma.pos, mb.pos, t), yaw: lerp(ma.yaw, mb.yaw, t), pitch: lerp(ma.pitch, mb.pitch, t) };
}

/* Igual patrón que sampleMovement, pero por objeto: interpola
   posición/escala/rotación de un objeto de entorno entre las dos
   etapas que rodean el progreso actual. */
function sampleObjectTransform(transformsByStage, progress, stages, easings) {
  const withFade = (t, st) => ({ ...t, fadeAmt: st.amt, fadeMode: st.dir, fadeOut: st.out });
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) { const t0 = transformsByStage[stages[0].id]; return withFade(t0, fadeStateFor(t0, t0, 0)); }
  const last = stages[stages.length - 1];
  if (p >= last.progress) { const tl = transformsByStage[last.id]; return withFade(tl, fadeStateFor(tl, tl, 1)); }
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ta = transformsByStage[a.id], tb = transformsByStage[b.id];
  return withFade({
    position: lerpVec3(ta.position, tb.position, t),
    scale: lerp(ta.scale, tb.scale, t),
    rotationY: lerp(ta.rotationY, tb.rotationY, t),
    sx: lerp(ta.sx ?? 1, tb.sx ?? 1, t),
    sy: lerp(ta.sy ?? 1, tb.sy ?? 1, t),
    rv: lerp(ta.rv ?? 1, tb.rv ?? 1, t),
    rz: lerp(ta.rz || 0, tb.rz || 0, t),
    rx: lerp(ta.rx || 0, tb.rx || 0, t),
    tk: lerp(ta.tk || 0, tb.tk || 0, t),
    lh: lerp(ta.lh || 0, tb.lh || 0, t),
    sh: ta.sh || tb.sh ? shapeLerp(ta.sh, tb.sh, t) : null,
    lt: lerpVec3(ta.lt || [0, 0, 0], tb.lt || [0, 0, 0], t),
    li: lerp(ta.li ?? 1, tb.li ?? 1, t),
    bl: lerp(ta.bl || 0, tb.bl || 0, t),
    sm: ta.sm || tb.sm ? smokeLerp(ta.sm, tb.sm, t) : null,
  }, fadeStateFor(ta, tb, t));
}

//@@use hexToRgba
//@@use backgroundCss
function lerpColorHex(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}
/* Mezcla de dos hex en sRGB (igual que un degradé CSS), para calcular el medio "implícito" de un degradé de 2 colores. */
function bgMixHex(a, b, p) {
  const px = (hex) => { let h = String(hex).replace("#", ""); if (h.length === 3) h = h.split("").map((c) => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const A = px(a), B = px(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, "0")).join("");
}
function bgMidOf(bg) { return bg.mid && bg.midOn !== false ? bg.mid : null; }
function lerpBgMid(ba, bb, t) {
  const ma = bgMidOf(ba), mb = bgMidOf(bb);
  if (!ma && !mb) return {};
  const pa = ba.midPos == null ? 50 : ba.midPos, pb = bb.midPos == null ? 50 : bb.midPos;
  const ca = ma || bgMixHex(ba.from, ba.to, pa / 100);
  const cb = mb || bgMixHex(bb.from, bb.to, pb / 100);
  return { mid: lerpColorHex(ca, cb, t), midPos: lerp(pa, pb, t) };
}
function lerpAngleDeg(a, b, t) {
  let diff = ((b - a + 180) % 360 + 360) % 360 - 180;
  return a + diff * t;
}
function lightDirFromAngles(azimuthDeg, elevationDeg, distance) {
  const az = (azimuthDeg * Math.PI) / 180;
  const el = (elevationDeg * Math.PI) / 180;
  return [
    distance * Math.cos(el) * Math.sin(az),
    distance * Math.sin(el),
    distance * Math.cos(el) * Math.cos(az),
  ];
}

/* Igual que sampleCamera/sampleMovement pero para Ambiente (luz, rim,
   niebla, fondo), para poder previsualizarlo también interpolado en la
   pestaña Preview. Fuera de Preview se usa el valor crudo de la etapa
   activa (ver App). */
function sampleFx(fxByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return fxByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return fxByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const fa = fxByKf[a.id], fb = fxByKf[b.id];
  return {
    light: {
      color: lerpColorHex(fa.light.color, fb.light.color, t),
      intensity: lerp(fa.light.intensity, fb.light.intensity, t),
      azimuth: lerpAngleDeg(fa.light.azimuth ?? 45, fb.light.azimuth ?? 45, t),
      elevation: lerp(fa.light.elevation ?? 35, fb.light.elevation ?? 35, t),
      rimColor: lerpColorHex(fa.light.rimColor, fb.light.rimColor, t),
      rimIntensity: lerp(fa.light.rimIntensity, fb.light.rimIntensity, t),
      ambient: lerp(fa.light.ambient ?? 0.28, fb.light.ambient ?? 0.28, t),
    },
    fog: {
      enabled: t < 0.5 ? (fa.fog.enabled ?? true) : (fb.fog.enabled ?? true),
      color: lerpColorHex(fa.fog.color, fb.fog.color, t),
      far: lerp(fa.fog.far, fb.fog.far, t),
    },
    background: {
      from: lerpColorHex(fa.background.from, fb.background.from, t),
      to: lerpColorHex(fa.background.to, fb.background.to, t),
      angle: lerp(fa.background.angle ?? 180, fb.background.angle ?? 180, t),
      alpha: lerp(fa.background.alpha ?? 1, fb.background.alpha ?? 1, t),
      ...lerpBgMid(fa.background, fb.background, t),
    },
  };
}

/* ---- Personaje ----
   Se monta UNA sola vez y sólo cambian sus props, para que cambiar de
   pestaña o de etapa activa nunca provoque un remount de <primitive>
   (un remount forzaría a recapturar como "rest pose" una pose ya
   deformada). Este detalle es exclusivo de esta herramienta de
   edición: en el archivo final exportado el personaje siempre se
   monta una sola vez.

   `scale` y `centerY` ahora se reciben como props (antes estaban
   hardcodeados como scale={1.7} / position={[0,-0.9,0]}), para que la
   pestaña "Modelo principal" del panel pueda controlarlos en vivo —
   igual que Escala/Posición en un objeto de la pestaña "Objetos". */
function Character({ pose, onBonesFound, modelUrl, scale, centerY }) {
  const { scene } = useGLTF(modelUrl);
  const bonesRef = useRef({});
  const restRef = useRef({});

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    onBonesFound(found);
  }, [scene]);

  useEffect(() => {
    scene.traverse((child) => {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });
  }, [scene]);
  // Mismo entorno de reflejos que reciben los objetos .glb: así el mismo modelo se ve igual como Modelo principal que como objeto (rig "Premium producto").
  const envTexC = useStudioEnv();
  const envCfgC = React.useContext(EnvSettingsCtx);
  useEffect(() => {
    if (envCfgC.rig !== "studio") return;
    // el .glb casi nunca trae su propio envMap: se recuerda "sin mapa" para que el reflejo del probe (modo clásico) no se confunda con uno propio
    scene.traverse((c) => { if (c.isMesh && c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach((m) => { if (m && m.isMeshStandardMaterial && !m.userData.__env0) m.userData.__env0 = { map: null, i: m.envMapIntensity }; }); });
    applyStudioEnv(scene, envTexC, envCfgC.enabled, envCfgC.intensity);
  }, [scene, envTexC, envCfgC.rig, envCfgC.enabled, envCfgC.intensity]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;

/* Estela de brillo (sparkle trail) — misma implementación que la

//@@use TRAIL_FRAGMENT_SHADER
function SparkleTrail({ anchorRef, enabled, color, size, life, rate }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const particles = useRef([]);
  const maxParticles = useMemo(() => Math.max(8, Math.ceil(rate * life) + 8), [rate, life]);
  const positions = useMemo(() => new Float32Array(maxParticles * 3), [maxParticles]);
  const sizes = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const opacities = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const emitAccum = useRef(0);
  const prevAnchor = useRef(null);
  const { camera: trailCam } = useThree();
  const backV = useMemo(() => new THREE.Vector3(), []);
  const bbox = useMemo(() => ({ box: new THREE.Box3(), c: new THREE.Vector3(), sz: new THREE.Vector3(), r: 0.5, ok: false, n: 0 }), []);

  useEffect(() => {
    if (materialRef.current) materialRef.current.uniforms.uColor.value.set(color);

  useFrame((_, delta) => {
    const group = pointsRef.current;
    const anchor = anchorRef && anchorRef.current;
    if (!group) return;

    if (!enabled || !anchor) {
      group.visible = false;
      particles.current.length = 0;
      prevAnchor.current = null;
      return;
    }
    group.visible = true;

    const ax = anchor.position.x, ay = anchor.position.y, az = anchor.position.z;

    // Las chispas se corren hacia "atrás" (alejándose de la cámara) el radio del modelo: así el .glb las tapa cuando la cámara lo ve de frente,
    // sin importar de qué lado del personaje salgan.
    if (!bbox.ok || bbox.n++ % 30 === 0) {

      if (!bbox.box.isEmpty()) { bbox.box.getCenter(bbox.c); bbox.box.getSize(bbox.sz); bbox.r = Math.min(60, Math.max(0.05, bbox.sz.length() * 0.5)); bbox.ok = true; }
    }
    if (bbox.ok) { backV.copy(bbox.c).sub(trailCam.position); if (backV.lengthSq() > 1e-8) backV.normalize().multiplyScalar(bbox.r * 0.8); else backV.set(0, 0, 0); } else backV.set(0, 0, 0);

    if (prevAnchor.current) {
      emitAccum.current += delta;
      const emitEvery = 1 / Math.max(rate, 1);
      const from = prevAnchor.current;
      while (emitAccum.current >= emitEvery) {
        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length > maxParticles) particles.current.shift();
      }
    }
    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i >= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age >= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i < n; i++) {
      const p = particles.current[i];
      const t = clamp(p.age / life);
      const drift = t;
      positions[i * 3] = p.x + p.ox * drift + backV.x;
      positions[i * 3 + 1] = p.y + p.oy * drift + t * size * 4 + backV.y;
      positions[i * 3 + 2] = p.z + p.oz * drift + backV.z;
      const twinkle = 0.5 + 0.5 * Math.sin(now * 9 + p.seed * 7);
      opacities[i] = (1 - t) * (1 - t) * (0.35 + 0.65 * twinkle);
      sizes[i] = size * p.sizeMul * (1 - t * 0.35);
    }

    const geom = group.geometry;
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.setDrawRange(0, n);
  });

  const [gone, setGone] = useState(false);

    lock(true);

    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ctl = zoomRef.current ? ldrPrepare(zoomRef.current, cfg.svg, cfg.lineColor || "#ffffff", cfg.lineWidth || 1.4) : null;

        .catch(() => {})
        .then(() => { fontsOk = true; });

      target = Math.min(target, (el / minMs) * 100);
      const loaded = simulate ? el >= minMs : (L.total > 0 ? L.progress >= 100 && !L.active : el > 3500);

        if (numRef.current) numRef.current.style.opacity = String(1 - ldrClamp(x / 0.2));

    </div>
  );

/* ---- SEO / indexación ----
   La página es un <canvas>: sin esto Google (y WhatsApp, redes, lectores de pantalla) no ven ningún texto.
   Se escribe HTML real en el index.html: <head> (título, descripción, Open Graph, datos estructurados del negocio)
   y un bloque de texto semántico (h1/h2/p) fuera de la vista pero accesible y legible por buscadores. */
const DEFAULT_SEO = {

  const out = []; let para = [], list = [];
  const flush = () => {
    if (para.length) { out.push("<p>" + seoEsc(para.join(" ")) + "</p>"); para = []; }
    if (list.length) { out.push("<ul>" + list.map((x) => "<li>" + seoEsc(x) + "</li>").join("") + "</ul>"); list = []; }
  };
  String(text || "").split(/\r?\n/).forEach((raw) => {
    const l = raw.trim();
    if (!l) { flush(); return; }
    const h = /^(#{1,3})\s+(.*)$/.exec(l);
    if (h) { flush(); out.push("<h" + h[1].length + ">" + seoEsc(h[2]) + "</h" + h[1].length + ">"); return; }
    const li = /^[-*]\s+(.*)$/.exec(l);
    if (li) { if (para.length) flush(); list.push(li[1]); return; }
    if (list.length) flush();
    para.push(l);
  });
  flush();
  return out;
}
