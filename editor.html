  const f2 = sel && sel.type !== "scene3d" ? S2D_FIELDS[sel.type] || [] : [];
  return (
    <>
      <Group id="pg-list" title="Orden de la página">
        <div style={{ fontSize: 10.5, opacity: 0.65, lineHeight: 1.4 }}>La página se arma de arriba hacia abajo. La escena 3D es un bloque más: ponela primero (portada), en el medio, o sacala para un sitio solo 2D.</div>
        <div className="pg-list">
          {sections.map((s, i) => (
            <div key={s.id} className={"pg-row" + (s.id === selSec ? " on" : "") + (s.type === "scene3d" ? " is3d" : "")} onClick={() => setSelSec(s.id)}>
              <span className="pg-n">{i + 1}</span>
              <span className="pg-t">{s2dLabel(s, nStages, totalVh, durationsVh)}</span>
              <button className="mini" title="Subir" disabled={i === 0} onClick={(e) => { e.stopPropagation(); move(s.id, -1); }}>↑</button>
              <button className="mini" title="Bajar" disabled={i === sections.length - 1} onClick={(e) => { e.stopPropagation(); move(s.id, 1); }}>↓</button>
              {s.type !== "scene3d" && <button className="mini" title="Duplicar" onClick={(e) => { e.stopPropagation(); dup(s.id); }}>⧉</button>}
              <button className="mini" title="Quitar" onClick={(e) => { e.stopPropagation(); remove(s.id); }}>✕</button>
            </div>
          ))}
        </div>
        <div className="row">
          <select style={{ flex: 1 }} value={addType} onChange={(e) => setAddType(e.target.value)}>{S2D_TYPES.map(([v, t]) => <option key={v} value={v}>{t}</option>)}</select>
          <Btn icon="plus" kind="acc" onClick={add}>Agregar bloque</Btn>
        </div>
        <div className="tools"><Btn icon="cube" onClick={add3d}>{has3d ? "Agregar otro tramo 3D (misma escena)" : "Agregar la escena 3D"}</Btn></div>
        <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.4 }}>El bloque nuevo se agrega debajo del seleccionado. Hacé clic en un bloque de la vista previa para editarlo.</div>
        {used.size > 0 && <div style={{ fontSize: 10.5, color: "#ffb454", lineHeight: 1.45 }}>Subí estas imágenes a assets/img/ de tu repo: {Array.from(used).join(", ")}</div>}
      </Group>

      {sel && sel.type !== "scene3d" && (
        <>
          <Group id="pg-edit" title={"Contenido · " + ((S2D_TYPES.find((x) => x[0] === sel.type) || [])[1] || "")}>
            {f2.map((f) => <S2DField key={sel.id + f[0]} f={f} s={sel} set={(patch) => upd(sel.id, patch)} toast={toast} />)}
          </Group>
          <Group id="pg-style" title="Estilo del bloque" defaultOpen={false}>
            <div className="row"><span className="lbl">Fondo</span><HexColor value={sel.bg || T.bg} onChange={(v) => upd(sel.id, { bg: v })} />{sel.bg && <button className="mini" onClick={() => upd(sel.id, { bg: "" })}>Usar el del sitio</button>}</div>
            <div className="row"><span className="lbl">Texto</span><HexColor value={sel.color || T.text} onChange={(v) => upd(sel.id, { color: v })} />{sel.color && <button className="mini" onClick={() => upd(sel.id, { color: "" })}>Usar el del sitio</button>}</div>
            <div className="row"><span className="lbl">Acento</span><HexColor value={sel.accent || T.accent} onChange={(v) => upd(sel.id, { accent: v })} />{sel.accent && <button className="mini" onClick={() => upd(sel.id, { accent: "" })}>Usar el del sitio</button>}</div>
            <SelectRow label="Espacio vertical" value={sel.pad || "m"} onChange={(v) => upd(sel.id, { pad: v })} options={[["s", "Chico"], ["m", "Normal"], ["l", "Grande"]]} />
            <S2DField f={["bgImage", "Imagen de fondo", "img"]} s={sel} set={(patch) => upd(sel.id, patch)} toast={toast} />
            {sel.bgImage && <Slider label="Oscurecer fondo" min={0} max={0.95} step={0.05} value={sel.overlay == null ? 0.55 : sel.overlay} onChange={(v) => upd(sel.id, { overlay: v })} />}
            <div className="row"><span className="lbl">Nombre del ancla</span><input type="text" style={{ flex: 1 }} value={sel.anchor || ""} placeholder="ej: servicios (para links y menú)" spellCheck={false} onChange={(e) => upd(sel.id, { anchor: e.target.value.toLowerCase().replace(/[^a-z0-9-]+/g, "-") })} /></div>
          </Group>
          <Group id="pg-anim" title="Animación de entrada">
            <SelectRow label="Efecto" value={(sel.anim && sel.anim.type) || "none"} onChange={(v) => upd(sel.id, { anim: { ...S2D_ANIM_DEFAULT, ...(sel.anim || {}), type: v } })} options={S2D_ANIMS} />
            {sel.anim && sel.anim.type && sel.anim.type !== "none" && (
              <>
                <div className="row"><span className="lbl">Curva</span>
                  <select style={{ flex: 1 }} value={sel.anim.ease || "outExpo"} onChange={(e) => upd(sel.id, { anim: { ...sel.anim, ease: e.target.value } })}>
                    {S2D_EASES.map(([g, os]) => <optgroup key={g} label={g}>{os.map(([v, t]) => <option key={v} value={v}>{t}</option>)}</optgroup>)}
                  </select>
                </div>
                <Slider label="Duración (s)" min={0.2} max={2.5} step={0.05} value={sel.anim.dur || 0.9} onChange={(v) => upd(sel.id, { anim: { ...sel.anim, dur: v } })} />
                <SelectRow label="Cómo entra" value={sel.anim.mode === "items" ? "items" : "block"} onChange={(v) => upd(sel.id, { anim: { ...sel.anim, mode: v } })} options={[["block", "Todo el bloque junto (liviano, recomendado)"], ["items", "Elemento por elemento, escalonado (más pesado)"]]} />
                {sel.anim.mode === "items" && <Slider label="Escalonado (s)" min={0} max={0.4} step={0.01} value={sel.anim.stagger == null ? 0.09 : sel.anim.stagger} onChange={(v) => upd(sel.id, { anim: { ...sel.anim, stagger: v } })} />}
              </>
            )}
            <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.4 }}>Cada elemento del bloque (título, texto, botones, tarjetas, fotos) entra uno tras otro cuando aparece en pantalla. Usa las mismas curvas de tiempo que las poses del 3D. En la vista previa, el botón "Repetir animaciones" la reproduce de nuevo.</div>
          </Group>
        </>
      )}
      {sel && sel.type === "scene3d" && (() => {
        const [pa, pb] = s3dRange(sel, nStages);
        const n3 = sections.filter((x) => x.type === "scene3d").length;
        const opts = Array.from({ length: nStages }, (_, k) => [String(k + 1), "Pose " + (k + 1)]);
        const idx = sections.findIndex((x) => x.id === sel.id);
        const adj = (idx > 0 && sections[idx - 1].type === "scene3d") || (idx < sections.length - 1 && sections[idx + 1].type === "scene3d");
        return (
          <Group id="pg-3d" title="Escena 3D">
            <div style={{ fontSize: 11, opacity: 0.8, lineHeight: 1.5 }}>El 3D queda fijo en pantalla mientras scrolleás este tramo ({s3dVh(sel, nStages, durationsVh, totalVh)} vh) y después la página sigue con el bloque de abajo. Las poses, la cámara y la duración de cada pose se editan en las otras pestañas.</div>
            <SelectRow label="Desde la pose" value={String(pa)} onChange={(v) => upd(sel.id, { poseFrom: +v, poseTo: Math.max(+v, pb) })} options={opts} />
            <SelectRow label="Hasta la pose" value={String(pb)} onChange={(v) => upd(sel.id, { poseTo: +v, poseFrom: Math.min(+v, pa) })} options={opts} />
            {n3 > 1 && <div style={{ fontSize: 10.5, opacity: 0.7, lineHeight: 1.5 }}>Es la misma escena en varios tramos: un tramo puede terminar en la pose donde empieza el siguiente (así no se nota el corte). Tiene {n3} tramos en la página.</div>}
            {adj && <div style={{ fontSize: 10.5, color: "#ffb454", lineHeight: 1.5 }}>Dos tramos 3D seguidos pueden mostrar un hueco al pasar de uno al otro: poné entre ellos al menos una página 2D alta (de pantalla completa).</div>}
            {(pa !== 1 || pb !== nStages) && <div className="tools"><button className="mini" onClick={() => upd(sel.id, { poseFrom: 0, poseTo: 0 })}>Usar todas las poses</button></div>}
          </Group>
        );
      })()}

      {sel && sections.findIndex((x) => x.id === sel.id) > 0 && (
        <Group id="pg-ovl" title="Transición con la sección anterior" defaultOpen={false}>
          <SelectRow label="Efecto" value={sel.overlap || "none"} onChange={(v) => upd(sel.id, { overlap: v })} options={[["none", "Ninguno (una sección tras otra)"], ["cover", "Cortina: se desliza sobre la anterior (con sombra y bordes redondeados)"], ["flat", "Cortina plana (sin sombra ni bordes)"]]} />
          {sel.overlap && sel.overlap !== "none" && sel.overlap !== "flat" && <Slider label="Sombra" min={0} max={1} step={0.05} value={sel.overlapShadow == null ? 0.5 : sel.overlapShadow} onChange={(v) => upd(sel.id, { overlapShadow: v })} />}
          <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.45 }}>La sección anterior queda quieta y esta se desliza por encima (efecto parallax / cortina). Sirve también entre el 3D y el 2D: al salir del 3D la página 2D tapa la escena, y al entrar al 3D desde una página 2D la escena sube encima. Funciona con el scroll nativo, sin trabar el celular.</div>
        </Group>
      )}
      <Group id="pg-theme" title="Estilo general del sitio 2D" defaultOpen={false}>
        <ColorRow label="Fondo" value={T.bg} onChange={(v) => setT({ bg: v })} />
        <ColorRow label="Texto" value={T.text} onChange={(v) => setT({ text: v })} />
        <ColorRow label="Acento / botones" value={T.accent} onChange={(v) => setT({ accent: v })} />
        <SelectRow label="Letra de títulos" value={T.fontHead} onChange={(v) => setT({ fontHead: v })} options={fontOpts} />
        <SelectRow label="Letra de textos" value={T.fontBody} onChange={(v) => setT({ fontBody: v })} options={fontOpts} />
        <Slider label="Redondeo" min={0} max={40} step={1} value={T.radius} onChange={(v) => setT({ radius: v })} />
        <Slider label="Ancho máximo" min={720} max={1500} step={20} value={T.maxWidth} onChange={(v) => setT({ maxWidth: v })} />
      </Group>
    </>
  );
}
function PagesPreview({ sections, theme, view, setView, replay, setReplay, selSec, setSelSec, nStages, totalVh, durationsVh }) {

function SeoPanel({ seo, setSeoField, pack, dock }) {
  const s = { ...DEFAULT_SEO, ...seo };
  const txt = (label, field, placeholder) => (
    <div className="row"><span className="lbl">{label}</span>
      <input type="text" style={{ flex: 1 }} value={s[field] || ""} placeholder={placeholder} spellCheck={false} onChange={(e) => setSeoField(field, e.target.value)} />
    </div>
  );
  const note = (t) => <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.4 }}>{t}</div>;
  const count = (v, max) => { const n = String(v || "").length; return <span style={{ fontSize: 10.5, color: n > max ? "#ffb454" : "inherit", opacity: n > max ? 1 : 0.6 }}>{n} / {max}</span>; };
  const download = (name, text, type) => {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const shownTitle = (s.title || s.siteName || "Título de tu sitio").slice(0, 60);

  return (
    <>
      <Group id="seo-check" title="Chequeo de SEO">
        {(() => {
          const t = String(s.title || s.siteName || "").trim(), de = String(s.description || "").trim(), im = String(s.image || "").trim(), u = String(s.url || "").trim();
          const ph = String((dock && dock.whatsappPhone) || "").replace(/\D/g, "");
          const items = [
            [t.length >= 15 && t.length <= 60, "Título de 15 a 60 caracteres", t ? t.length + " caracteres" : "falta"],
            [de.length >= 70 && de.length <= 160, "Descripción de 70 a 160 caracteres", de ? de.length + " caracteres" : "falta"],
            [/^https:\/\//.test(u), "URL del sitio con https://", u ? "revisá que empiece con https://" : "falta (necesaria para canonical y sitemap)"],
            [/^https?:\/\//.test(im), "Imagen para compartir con URL completa", im ? "debe empezar con https://" : "falta (1200 × 630 px)"],
            [!!String(s.favicon || "").trim(), "Ícono del sitio (favicon)", "falta"],
            [s.index !== false, "Indexable por buscadores", "está bloqueado (noindex)"],
            [!!String(s.businessName || s.siteName || "").trim() && s.jsonld !== false, "Datos del negocio para Google", "falta el nombre del negocio"],
            [!!(dock && dock.address), "Dirección cargada (datos del negocio)", "falta en Escena · Datos del negocio"],
            [ph.length >= 10, "Teléfono cargado (datos del negocio)", "falta en Escena · Datos del negocio"],
            [(s.content || "").trim().length > 80 || s.includeScene !== false, "Texto para buscadores", "agregá texto o dejá el automático"],

                </div>

            </>

        })()}

      <Group id="seo-g" title="Cómo aparece en Google">

        <div className="row" style={{ alignItems: "flex-start" }}><span className="lbl">Descripción</span>
          <textarea rows={3} style={{ flex: 1 }} value={s.description || ""} placeholder="1 o 2 frases: qué ofrecés, dónde y cómo contactarte." onChange={(e) => setSeoField("description", e.target.value)} />

          <div style={{ fontSize: 12, color: "#4d5156", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{host}</div>
          <div style={{ fontSize: 17, color: "#1a0dab", lineHeight: 1.3 }}>{shownTitle}</div>
          <div style={{ fontSize: 13, color: "#4d5156", lineHeight: 1.4 }}>{shownDesc}</div>
        </div>
        {note("Se muestran hasta ~60 caracteres del título y ~160 de la descripción. Google puede reescribirlos, pero parte de lo que escribas acá.")}
        <SelectRow label="Idioma" value={s.lang} onChange={(v) => setSeoField("lang", v)} options={[["es-AR", "Español (Argentina)"], ["es", "Español"], ["es-MX", "Español (México)"], ["es-ES", "Español (España)"], ["pt-BR", "Português (Brasil)"], ["en", "English"]]} />

        {txt("Tipo", "businessType", "LocalBusiness (o Dentist, Restaurant, Store…)")}
        {txt("Instagram", "instagram", "https://instagram.com/tu_usuario")}
        {txt("Facebook", "facebook", "https://facebook.com/tu_pagina")}
        <div className="row" style={{ alignItems: "flex-start" }}><span className="lbl">Otras redes</span>
          <textarea rows={2} style={{ flex: 1 }} value={s.otherLinks || ""} placeholder={"TikTok, YouTube, Google Maps… un link por línea"} onChange={(e) => setSeoField("otherLinks", e.target.value)} />
        </div>
        {txt("Email", "email", "contacto@tusitio.com")}
        {txt("Logo (URL)", "logo", "https://tusitio.com/logo.png")}
        {txt("Rango de precios", "priceRange", "$$ (opcional)")}
        {txt("Zona de atención", "areaServed", "Ej: Palermo, CABA")}
        <div className="row"><span className="lbl">Ubicación</span>
          <input type="text" style={{ flex: 1, minWidth: 0 }} value={s.geoLat || ""} placeholder="Latitud -34.58" spellCheck={false} onChange={(e) => setSeoField("geoLat", e.target.value)} />
          <input type="text" style={{ flex: 1, minWidth: 0 }} value={s.geoLng || ""} placeholder="Longitud -58.43" spellCheck={false} onChange={(e) => setSeoField("geoLng", e.target.value)} />
        </div>
        {note("El teléfono (WhatsApp), la dirección y los horarios se toman solos de 'Datos del negocio' (pestaña Escena). Así no los cargás dos veces.")}
      </Group>
      <Group id="seo-text" title="Texto para buscadores">
        <textarea rows={12} style={{ width: "100%", boxSizing: "border-box", fontFamily: "ui-monospace, monospace", fontSize: 12 }} value={s.content || ""} spellCheck={false}
          placeholder={"# Nombre del negocio\n\nQué hacés, dónde y para quién.\n\n## Servicios\n- Servicio uno\n- Servicio dos\n- Servicio tres"} onChange={(e) => setSeoField("content", e.target.value)} />
        {note("Formato: '# Título' (el principal, uno solo), '## Subtítulo', '- ' para listas; una línea en blanco separa párrafos. Si no ponés un '# ', se usa el título de arriba como título principal.")}
        <Switch checked={s.includeScene !== false} onChange={(v) => setSeoField("includeScene", v)} label="Sumar automático: textos de la escena, WhatsApp, dirección y horarios" />
        <Switch checked={s.noscript !== false} onChange={(v) => setSeoField("noscript", v)} label="Página simple para quien no tiene JavaScript" />
        {note("Este texto no se ve en pantalla, pero está en el HTML para buscadores y lectores de pantalla. Escribí lo mismo que dice o muestra tu sitio: Google ignora (o penaliza) el texto oculto que no coincide con lo visible.")}
      </Group>
      <Group id="seo-files" title="Archivos para publicar" defaultOpen={false}>
        <div className="tools">
          <Btn icon="file" onClick={() => download("robots.txt", generateRobotsTxt(s.url), "text/plain")}>robots.txt</Btn>
          <Btn icon="file" disabled={!String(s.url || "").trim()} onClick={() => download("sitemap.xml", generateSitemapXml(s.url), "application/xml")}>sitemap.xml</Btn>
        </div>
        {note("Subilos junto al index.html (misma carpeta raíz). El sitemap necesita la URL del sitio. Después podés enviar la URL en Google Search Console para pedir la indexación.")}
      </Group>
      <Group id="seo-pv" title="Lo que va a leer Google (vista previa)" defaultOpen={false}>
        <textarea className="code" readOnly value={pack.head + "\n\n" + pack.body} onFocus={(e) => e.target.select()} style={{ minHeight: 220 }} />
      </Group>
    </>
  );
}

function buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode, modelUrlCode, postFxCode, charTransformCode, trailCode, reflectionCode, loaderCode, loaderCss, extrasCode, seoPack, sectionsCode) {
  const tplEl = document.getElementById("tpl-source");
  let tpl = tplEl.value;
  const swap = (src, startMark, endMark, code) => {
    const start = src.indexOf(startMark);
    const end = src.indexOf(endMark);
    if (start === -1 || end === -1) return src;
    const before = src.slice(0, start + startMark.length);
    const after = src.slice(end);
    return `${before}\n${code}\n${after}`;
  };
  tpl = swap(tpl, "/*@GEN:MODEL_URL_START*/", "/*@GEN:MODEL_URL_END*/", modelUrlCode);
  tpl = swap(tpl, "/*@GEN:SCENES_START*/", "/*@GEN:SCENES_END*/", scenesCode);
  tpl = swap(tpl, "/*@GEN:MOVEMENT_DEFS_START*/", "/*@GEN:MOVEMENT_DEFS_END*/", movementCode);

/* ---- Pesómetro: estima cuánto le cuesta la escena a un celular de gama media ----

function LoadMeterProbe() {
  const { scene } = useThree();
  useEffect(() => {
    const run = () => {
      let tris = 0, cTris = 0, calls = 0, lights = 0; const sh = [];

        tris += n; calls++; if (o.castShadow) cTris += n;

      window.__wsLoad = { tris, cTris, calls, lights, sh };
    };
    run();
    const t = setInterval(run, 1000);
    return () => clearInterval(t);
  }, [scene]);

function LoadMeterHud({ postFx }) {

  const maxL = Math.max(0, Math.round((postFx && postFx.mobileLights) ?? 6));
  const lights = maxL > 0 ? Math.min(L.lights, maxL) : L.lights;
  let shCost = 0, shN = 0;
  L.sh.forEach((x) => {

  const parts = [

async function loadMp4Muxer() {

async function pickH264Config(w, h, fps, bitrate) {
  if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") {
    throw new Error("Este navegador no soporta WebCodecs. Usa Chrome o Edge actualizados (escritorio).");
  }
  for (const codec of ["avc1.64002A", "avc1.4D002A", "avc1.42002A"]) {
    const cfg = { codec, width: w, height: h, bitrate, framerate: fps, latencyMode: "quality" };
    try {
      const r = await VideoEncoder.isConfigSupported(cfg);
      if (r && r.supported) return cfg;
    } catch (e) { /* probar el siguiente */ }
  }
  throw new Error("Este equipo no puede codificar H.264 a " + w + "x" + h + " @" + fps + "fps. Proba 30 fps o Chrome/Edge.");

  const addStage = (afterId) => {

  const addOrbitLap = (dir) => {

          <ColorRow label="Color arriba" value={sp("color2")} onChange={set("color2")} />

          <Slider label="Huecos (más = más ralo)" min={0} max={0.8} step={0.01} value={g("smokeCut", 0.3)} onChange={(v) => U("smokeCut", v)} />
          <Slider label="Opacidad / espesor" min={1} max={20} step={0.1} value={g("smokeSigma", 10)} onChange={(v) => U("smokeSigma", v)} />
          <Slider label="Detalle (capas de ruido)" min={2} max={6} step={1} value={g("smokeOct", 4)} onChange={(v) => U("smokeOct", v)} />
          <Slider label="Bordes suaves" min={0.05} max={0.5} step={0.01} value={g("smokeEdge", 0.25)} onChange={(v) => U("smokeEdge", v)} />
          <Slider label="Viento X" min={-2} max={2} step={0.01} value={g("smokeWindX", 0)} onChange={(v) => U("smokeWindX", v)} />
          <Slider label="Viento Z" min={-2} max={2} step={0.01} value={g("smokeWindZ", 0)} onChange={(v) => U("smokeWindZ", v)} />
          <Slider label="Velocidad del tiempo" min={0} max={4} step={0.05} value={g("smokeSpeed", 1)} onChange={(v) => U("smokeSpeed", v)} />
          <Slider label="Semilla (cambia la forma)" min={0} max={50} step={1} value={g("smokeSeed", 1)} onChange={(v) => U("smokeSeed", v)} />
          <div className="grp-t" style={{ marginTop: 6 }}>Luz</div>
          <Slider label="Luz ambiente" min={0} max={2} step={0.01} value={g("smokeAmb", 0.5)} onChange={(v) => U("smokeAmb", v)} />
          <Slider label="Luz de relleno" min={0} max={3} step={0.01} value={g("smokeSun", 0.8)} onChange={(v) => U("smokeSun", v)} />
          <Slider label="Relleno · azimut" min={0} max={360} step={1} value={g("smokeSunAz", 35)} onChange={(v) => U("smokeSunAz", v)} />
          <Slider label="Relleno · altura" min={-90} max={90} step={1} value={g("smokeSunEl", 55)} onChange={(v) => U("smokeSunEl", v)} />
          <Slider label="Tus luces (spots)" min={0} max={3} step={0.01} value={g("smokeLMix", 1)} onChange={(v) => U("smokeLMix", v)} />
          <Slider label="Haces visibles (dispersión)" min={-0.5} max={0.9} step={0.01} value={g("smokeG", 0.35)} onChange={(v) => U("smokeG", v)} />
          <Slider label="Sombra interna" min={0} max={4} step={0.05} value={g("smokeShadow", 1.5)} onChange={(v) => U("smokeShadow", v)} />
          <Seg value={String(g("smokeQuality", 2))} onChange={(v) => U("smokeQuality", Number(v))} options={[["1", "MP4 normal"], ["2", "MP4 alta"], ["3", "MP4 máxima"]]} />
          <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Humo volumétrico real, pensado para el MP4: al exportar usa la calidad elegida (más muestras por cuadro, sombras internas) y el tiempo del video, así cada exportación sale idéntica y se puede avanzar y retroceder. En el visor se ve en calidad liviana. La caja define dónde hay humo: en «Columna» el humo nace en la base de la caja y sube. Si la caja atraviesa un objeto, el humo no se oculta detrás de él (se ve por encima): dejá los objetos fuera de la caja o usá cajas más chicas. Prende y apagá luces por pose para ver los haces dentro del humo.</div>
        </div>
      );
    }
    if (isLight) {
      const spot = o.lightKind !== "point";
      const total = objects.filter((x) => x.type === "light").length;
      return (
        <div className="oed" style={{ "--oc": c }}>
          {head}
          <Seg value={spot ? "spot" : "point"} onChange={(v) => updateObject(o.id, { lightKind: v })} options={[["spot", "Spot (haz dirigido)"], ["point", "Punto (todas direcciones)"]]} />
          <ColorRow label="Color" value={o.lightColor || "#fff4e0"} onChange={(v) => updateObject(o.id, { lightColor: v })} />
          <Slider label="Intensidad" min={0} max={400} step={1} value={o.lightIntensity ?? 80} onChange={(v) => updateObject(o.id, { lightIntensity: v })} />
          {spot && <Slider label="Apertura del haz °" min={5} max={80} step={1} value={o.lightAngle ?? 35} onChange={(v) => updateObject(o.id, { lightAngle: v })} />}
          {spot && <Slider label="Borde suave" min={0} max={1} step={0.01} value={o.lightPenumbra ?? 0.5} onChange={(v) => updateObject(o.id, { lightPenumbra: v })} />}
          <Slider label="Alcance (0 = sin límite)" min={0} max={60} step={0.5} value={o.lightDistance || 0} onChange={(v) => updateObject(o.id, { lightDistance: v })} />
          <Switch checked={!!o.lightShadow} onChange={(v) => updateObject(o.id, { lightShadow: v })} label="Proyecta sombra (pesa: usar en 1 o 2 luces)" />
          <div className="grp-t" style={{ marginTop: 6 }}>Posición y destino · {currentStageLabel}</div>
          <Vec3 label="Luz en" value={t.position} onChange={(a2, v) => setObjectTransform(o.id, "position", a2, v)} />
          {spot && <Vec3 label="Apunta a" value={t.lt || [0, 0, 0]} onChange={(a2, v) => setObjectTransform(o.id, "lt", a2, v)} />}
          <Slider label="Encendido en esta pose" min={0} max={2} step={0.01} value={t.li ?? 1} onChange={(v) => setObjectTransform(o.id, "li", null, v)} />
          <div className="tools">
            <Btn onClick={() => setObjectTransform(o.id, "li", null, 0)}>Apagar aquí</Btn>
            <Btn onClick={() => setObjectTransform(o.id, "li", null, 1)}>Encender (100%)</Btn>
            <Btn title="Apagada en todas las poses" onClick={() => setObjectAllStages(o.id, "li", 0)}>Apagar en todas</Btn>
            <Btn title="Encendida en todas las poses" onClick={() => setObjectAllStages(o.id, "li", 1)}>Encender en todas</Btn>

          <div className="grp-t" style={{ marginTop: 6 }}>Fila de luces</div>

          <div className="tools">

          </div>
          <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Las luces iluminan modelos 3D (.glb), el personaje, y los textos / imágenes que tengan prendido «Recibe luz». La posición, el destino y el encendido cambian entre poses y se animan con el scroll: apagá una luz en una pose y prendela en otra para que se encienda al scrollear. Para que los spots se noten, bajá la «Luz principal» y el «Ambiente» (pestaña Cámara). Línea punteada en el visor = hacia dónde apunta. Tenés {total} luz{total === 1 ? "" : "es"}; hasta 8 va bien, más pesa en celulares.</div>
        </div>
      );
    }
    return (
      <div className="oed" style={{ "--oc": c }}>
        {head}
        {isText ? (
          <TextStyleEditor o={o} updateObject={updateObject} />

          <div className="row">
            <span className="lbl">Archivo</span>
            <PathInput value={o.url} onCommit={(v) => setObjectUrl(o.id, v)} placeholder={isImage ? "./assets/models/imagen.svg" : isVideo ? "./assets/models/video.mp4" : "./assets/models/objeto.glb"} />

            <Slider label="Desde %" min={0} max={100} step={1} value={o.scrubFrom ?? 0} onChange={(v) => updateObject(o.id, { scrubFrom: Math.min(v, (o.scrubTo ?? 100) - 1) })} />
            <Slider label="Hasta %" min={0} max={100} step={1} value={o.scrubTo ?? 100} onChange={(v) => updateObject(o.id, { scrubTo: Math.max(v, (o.scrubFrom ?? 0) + 1) })} />

          </>

        {isVideo && o.videoMode === "play" && <Switch checked={o.loop !== false} onChange={(v) => updateObject(o.id, { loop: v })} label="Repetir en loop" />}
        {isVideo && <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Va siempre sin sonido. Copiá el archivo a assets/models/ junto al index.html. Para que avance fluido, exportalo con un keyframe cada 2 cuadros (ffmpeg -g 2).</div>}
        {(isImage || isVideo) && (
          <>
            <div className="grp-t" style={{ marginTop: 6 }}>Esquinas y marco</div>
            <Slider label="Redondeo %" min={0} max={50} step={0.5} value={(o.cornerRadius || 0) * 100} onChange={(v) => updateObject(o.id, { cornerRadius: v / 100 })} />
            <Slider label="Marco %" min={0} max={10} step={0.1} value={(o.borderWidth || 0) * 100} onChange={(v) => updateObject(o.id, { borderWidth: v / 100 })} />
            {(o.borderWidth || 0) > 0 && <ColorRow label="Color del marco" value={o.borderColor || "#ffffff"} onChange={(v) => updateObject(o.id, { borderColor: v })} />}
            <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Redondea las puntas de la foto o el video y le suma un marco de color. 50 % = óvalo / círculo. El grosor del marco es un porcentaje del lado más corto.</div>
          </>
        )}
        {isShape && (() => {
          const kind = o.shapeKind || "rect";
          const d = defaultShapeParams(), sp = (k) => (t.sh && t.sh[k] != null ? t.sh[k] : d[k]), set = (k) => (v) => setObjectShape(o.id, k, v);
          return (
            <>
              <SelectRow label="Tipo" value={kind} onChange={(v) => updateObject(o.id, { shapeKind: v })} options={[["rect", "Rectángulo / círculo"], ["line", "Línea / puntitos"], ["dots", "Grilla de puntos"]]} />

              {kind === "dots" && <Slider label="Filas" min={1} max={40} step={1} value={o.shapeRows || 4} onChange={(v) => updateObject(o.id, { shapeRows: v })} />}
              <div className="grp-t" style={{ marginTop: 6 }}>Forma · {currentStageLabel} (se anima entre poses)</div>

              {kind !== "line" && <Slider label="Alto" min={0.05} max={8} step={0.01} value={sp("h")} onChange={set("h")} />}

                  {sp("gradAmt") > 0 && (
                    <>
                      <SelectRow label="Tipo" value={o.shapeGrad || "linear"} onChange={(v) => updateObject(o.id, { shapeGrad: v })} options={[["linear", "Lineal"], ["radial", "Radial (desde el centro)"]]} />

                  <Slider label="Brillo propio" min={0} max={1} step={0.01} value={o.litBase ?? 0.05} onChange={(v) => updateObject(o.id, { litBase: v })} />
                  <Switch checked={!!o.shRecv} onChange={(v) => updateObject(o.id, { shRecv: v })} label="Recibe sombras" />

                </>
              )}
              {kind !== "line" && <ColorRow label={kind === "dots" ? "Color" : "Relleno"} value={sp("fillColor")} onChange={set("fillColor")} />}
              {kind !== "line" && <Slider label={kind === "dots" ? "Opacidad %" : "Relleno opac. %"} min={0} max={100} step={1} value={Math.round(sp("fillAlpha") * 100)} onChange={(v) => set("fillAlpha")(v / 100)} />}
              {kind !== "dots" && (
                <>
                  <ColorRow label="Trazo" value={sp("strokeColor")} onChange={set("strokeColor")} />
                  <Slider label="Trazo opac. %" min={0} max={100} step={1} value={Math.round(sp("strokeAlpha") * 100)} onChange={(v) => set("strokeAlpha")(v / 100)} />
                  <Slider label="Grosor" min={0} max={0.4} step={0.001} value={sp("strokeW")} onChange={set("strokeW")} />
                  <Slider label="Guion" min={0} max={1.5} step={0.005} value={sp("dash")} onChange={set("dash")} />
                  <Slider label="Hueco" min={0} max={1.5} step={0.005} value={sp("gap")} onChange={set("gap")} />
                  <Slider label="Desfase (marcha)" min={0} max={20} step={0.01} value={sp("shift")} onChange={set("shift")} />
                  <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Guion y Hueco en 0 = trazo continuo. Guion 0 con Hueco &gt; 0 = línea de puntitos. Cambiá el Desfase entre dos poses para que los guiones "caminen" al scrollear. Todo lo que cambies entre poses se anima solo.</div>
                </>
              )}
            </>
          );
        })()}
        {isModel && <Slider label="Brillo" min={0} max={3} step={0.05} value={o.glow || 0} onChange={(v) => updateObject(o.id, { glow: v })} />}
        {isModel && <Slider label="Vidrio (pantalla)" min={0} max={1} step={0.01} value={o.glass || 0} onChange={(v) => updateObject(o.id, { glass: v })} />}
        {isModel && (
          <>
            <span className="lbl" style={{ marginTop: 6 }}>Color del objeto</span>
            <Slider label="Matiz" min={-180} max={180} step={1} value={o.hue || 0} onChange={(v) => updateObject(o.id, { hue: v })} />
            <Slider label="Saturación" min={0} max={2} step={0.01} value={o.sat ?? 1} onChange={(v) => updateObject(o.id, { sat: v })} />
            <Slider label="Luminosidad" min={0} max={2} step={0.01} value={o.light ?? 1} onChange={(v) => updateObject(o.id, { light: v })} />
            <ColorRow label="Tinte" value={o.tint || "#ffffff"} onChange={(v) => updateObject(o.id, { tint: v })} />
            <Slider label="Cantidad de tinte" min={0} max={1} step={0.01} value={o.tintAmt || 0} onChange={(v) => updateObject(o.id, { tintAmt: v })} />
            {(o.hue || o.sat != null || o.light != null || o.tintAmt) && <div className="tools"><Btn onClick={() => updateObject(o.id, { hue: 0, sat: 1, light: 1, tint: "#ffffff", tintAmt: 0 })}>Restablecer color</Btn></div>}
          </>
        )}
        {isModel && (o.glass || 0) > 0 && (
          <>
            <div className="row">
              <span className="lbl">Material</span>
              <input type="text" style={{ flex: 1 }} value={o.glassMatch || ""} placeholder={SCREEN_GLASS_DEFAULT} spellCheck={false} onChange={(e) => updateObject(o.id, { glassMatch: e.target.value })} />
            </div>
            <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Agrega un reflejo suave tipo vidrio a los materiales cuyo nombre (en Blender) contenga alguna de esas palabras (separadas por |). Necesita el Entorno de reflejos prendido.</div>
          </>
        )}
        {isModel && <Switch checked={o.shadows !== false} onChange={(v) => updateObject(o.id, { shadows: v })} label="Sombras (proyecta / recibe)" />}
        {!isModel && <Switch checked={!!o.billboard} onChange={(v) => updateObject(o.id, { billboard: v })} label="Billboard (mira a cámara)" />}
        <Slider label="Flotar siempre (altura · 0 = no)" min={0} max={0.6} step={0.01} value={o.float || 0} onChange={(v) => updateObject(o.id, { float: v })} />
        {(o.float || 0) > 0 && <Slider label="Ritmo de la flotación" min={0.2} max={3} step={0.05} value={o.floatSpeed ?? 1} onChange={(v) => updateObject(o.id, { floatSpeed: v })} />}
        {(isText || isImage || (isShape && !o.phys)) && <Switch checked={!!o.lit} onChange={(v) => updateObject(o.id, { lit: v })} label="Recibe luz (spots y luces de la escena)" />}
        {(isText || isImage || (isShape && !o.phys)) && o.lit && <Slider label="Brillo propio" min={0} max={1} step={0.01} value={o.litBase ?? 0.2} onChange={(v) => updateObject(o.id, { litBase: v })} />}
        {(isText || isImage || (isShape && !o.phys)) && o.lit && <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Con esto el cartel se ve según la luz que le llega: oscuro donde no hay luz y brillante bajo los spots. «Brillo propio» es lo mínimo que se ve sin luz.</div>}
        {isImage && isSvgUrl(o.url) && (
          <>
            <div className="grp-t" style={{ marginTop: 4 }}>Volumen 3D (extruir el logo)</div>
            <Slider label="Grosor (0 = plano)" min={0} max={0.6} step={0.005} value={o.ext || 0} onChange={(v) => updateObject(o.id, { ext: v, ...(v > 0 && !o.ext && o.billboard ? { billboard: false } : {}) })} />
            {(o.ext || 0) > 0 && (
              <>
                <Switch checked={!!o.rev} onChange={(v) => updateObject(o.id, { rev: v })} label="Revolución (esfera, aro, cilindro: gira el perfil)" />
                {o.rev && <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>El SVG se lee como el perfil de medio corte: el borde izquierdo es el eje de giro y el alto es la altura real. Aro = un círculo separado del borde izquierdo; esfera = media circunferencia pegada al borde.</div>}
                <Slider label="Bisel (borde redondeado)" min={0} max={1} step={0.01} value={o.bev ?? 0.3} onChange={(v) => updateObject(o.id, { bev: v })} />
                <Slider label="Suavidad de curvas (0 = auto)" min={0} max={64} step={1} value={o.seg || 0} onChange={(v) => updateObject(o.id, { seg: v })} />
                <SelectRow label="Material" value={o.mat || "plastic"} onChange={(v) => updateObject(o.id, { mat: v, matRough: null })} options={Object.entries(SVG_MATS).map(([k, m]) => [k, m.label])} />
                <ColorRow label="Color" value={o.matColor || "#ffffff"} onChange={(v) => updateObject(o.id, { matColor: v })} />
                <div className="tools"><Btn title="Usa el color que trae el SVG (el oro y el cromo usan el suyo)" onClick={() => updateObject(o.id, { matColor: "" })}>Color original del SVG</Btn></div>
                <Slider label="Rugosidad" min={0} max={1} step={0.01} value={o.matRough != null ? o.matRough : (SVG_MATS[o.mat || "plastic"] || SVG_MATS.plastic).rough} onChange={(v) => updateObject(o.id, { matRough: v })} />
                <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Reacciona a la luz de la escena y a tus spots. Los metales y el cromo necesitan el «Entorno de reflejos» prendido (Look). Con «Billboard» el logo mira siempre a cámara y no se ve el volumen: apagalo y usá «Giro Y» para girarlo. El vidrio es más pesado en celulares.</div>
              </>
            )}
          </>
        )}
        {!isLight && !isSmoke && objects.length > 1 && (() => {
          const desc = new Set([o.id]); let grew = true;
          while (grew) { grew = false; objects.forEach((q) => { if (q.parent && desc.has(q.parent) && !desc.has(q.id)) { desc.add(q.id); grew = true; } }); }
          const opts = [["", "— ninguna (va sola) —"], ...objects.filter((q) => !desc.has(q.id) && q.type !== "light" && q.type !== "smoke").map((q) => [q.id, q.label])];
          const kids = objects.filter((q) => q.parent === o.id);
          return (
            <>
              <div className="grp-t" style={{ marginTop: 4 }}>Grupo</div>
              <SelectRow label="Sigue a (madre)" value={o.parent || ""} onChange={(v) => setObjectParent(o.id, v)} options={opts} />
              <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>
                {o.parent ? "Este objeto viaja con su madre: al mover, escalar o girar la madre en cada pose, él se mueve en bloque. Sus propios valores (Posición, Escala, Giro) son relativos a la madre, así que podés mantener la forma del conjunto o animarlo aparte. Aparecer/desaparecer sigue siendo propio de cada uno." : kids.length ? `Madre de: ${kids.map((q) => q.label).join(", ")}. Moverla mueve a todos sus hijos.` : "Elegí una madre para que este objeto se mueva en bloque con ella. No se mueve de donde está al vincularlo."}
              </div>
            </>
          );
        })()}
        <div className="grp-t" style={{ marginTop: 4 }}>Transformación · {currentStageLabel}</div>
        <Slider label="Escala" min={0.05} max={20} step={0.01} value={t.scale} onChange={(v) => setObjectTransform(o.id, "scale", null, v)} />
        {!isModel && <Slider label="Estirar ancho" min={0.05} max={6} step={0.01} value={t.sx ?? 1} onChange={(v) => setObjectTransform(o.id, "sx", null, v)} />}
        {!isModel && <Slider label="Desenfoque" min={0} max={30} step={0.1} value={t.bl || 0} onChange={(v) => setObjectTransform(o.id, "bl", null, v)} />}
        {!isModel && (t.bl || 0) > 0 && <div className="tools"><Btn title="Mismo desenfoque en todas las poses" onClick={() => setObjectAllStages(o.id, "bl", t.bl || 0)}>Desenfoque en todas las poses</Btn><Btn onClick={() => setObjectAllStages(o.id, "bl", 0)}>Quitar en todas</Btn></div>}
        {!isModel && <Slider label="Estirar alto" min={0.05} max={6} step={0.01} value={t.sy ?? 1} onChange={(v) => setObjectTransform(o.id, "sy", null, v)} />}
        <Vec3 label={o.parent ? "Posición (relativa a la madre)" : "Posición"} value={t.position} onChange={(a, v) => setObjectTransform(o.id, "position", a, v)} />
        {!(!isModel && o.billboard) && <Slider label="Giro Y" min={-180} max={180} step={0.1} value={t.rotationY} onChange={(v) => setObjectTransform(o.id, "rotationY", null, v)} />}
        {(
          <>
            <Slider label="Inclinación (acostar)" min={-90} max={90} step={1} value={t.rx || 0} onChange={(v) => setObjectTransform(o.id, "rx", null, v)} />
            <div className="tools">
              <Btn title="Lo acuesta como un piso SOLO en esta pose (se anima al pasar a otra pose); apaga el billboard" onClick={() => { setObjectTransform(o.id, "rx", null, -90); if (!isModel) updateObject(o.id, { billboard: false }); }}>Acostar aquí</Btn>
              <Btn title="Lo deja parado SOLO en esta pose" onClick={() => setObjectTransform(o.id, "rx", null, 0)}>Parar aquí</Btn>
              <Btn title="Lo acuesta como un piso en TODAS las poses; apaga el billboard" onClick={() => { setObjectRxAll(o.id, -90); if (!isModel) updateObject(o.id, { billboard: false }); }}>Acostar en todas</Btn>
              <Btn title="Lo deja parado en TODAS las poses" onClick={() => setObjectRxAll(o.id, 0)}>Parar en todas</Btn>
            </div>
          </>
        )}
        {(isText || isImage) && o.billboard && <div style={{ fontSize: 10.5, opacity: 0.6 }}>Para acostar o girar este elemento, apagá «Billboard (mira a cámara)».</div>}
        {(isText || isImage) && <Switch checked={!!o.shCast} onChange={(v) => updateObject(o.id, { shCast: v })} label="Proyecta sombra (con la forma de las letras; la reciben formas con Material 3D y modelos)" />}
        {!isModel && !isShape && (
          <>
            <Slider label="Giro Z (en el plano)" min={-180} max={180} step={1} value={t.rz || 0} onChange={(v) => setObjectTransform(o.id, "rz", null, v)} />
            <div className="tools">
              <Btn title="Texto vertical, se lee de abajo hacia arriba" onClick={() => setObjectTransform(o.id, "rz", null, 90)}>Vertical ↑</Btn>
              <Btn title="Texto vertical, se lee de arriba hacia abajo" onClick={() => setObjectTransform(o.id, "rz", null, -90)}>Vertical ↓</Btn>
              <Btn onClick={() => setObjectTransform(o.id, "rz", null, 0)}>Horizontal</Btn>
            </div>
          </>
        )}
        <div className="grp-t" style={{ marginTop: 6 }}>Visibilidad · {currentStageLabel}</div>
        <Switch checked={!!t.hidden} onChange={(v) => setObjectTransform(o.id, "hidden", null, v)} label="Invisible en esta pose" />
        <div className="tools">
          <Btn title="Visible en todas las poses" onClick={() => setObjectHiddenMode(o.id, "all")}>En todas</Btn>
          <Btn title="Visible solo en la pose actual; oculto en las demás" onClick={() => setObjectHiddenMode(o.id, "only")}>Solo aquí</Btn>
          <Btn title="Oculto antes de la pose actual, visible desde aquí hasta el final" onClick={() => setObjectHiddenMode(o.id, "showFrom")}>Desde aquí ▶</Btn>
          <Btn title="Visible hasta antes de la pose actual, oculto desde aquí hasta el final" onClick={() => setObjectHiddenMode(o.id, "hideFrom")}>Hasta aquí ◀</Btn>
        </div>
        {!(isText && o.textEffect && o.textEffect !== "none") && <div className="row">
          <span className="lbl">Animación</span>
          <select value={t.fadeDir || "ltr"} onChange={(e) => setObjectTransform(o.id, "fadeDir", null, e.target.value)}>
            <optgroup label="Barrido de transparencia"><option value="ltr">Barrido Izq → Der</option><option value="rtl">Barrido Der → Izq</option><option value="wipeUp">Barrido hacia arriba</option><option value="wipeDown">Barrido hacia abajo</option><option value="fade">Fundido simple</option></optgroup>
            {!isText && <optgroup label="Movimiento"><option value="up">Subir</option><option value="down">Bajar</option><option value="slideL">Deslizar ←</option><option value="slideR">Deslizar →</option></optgroup>}
            {!isText && <optgroup label="Escala"><option value="zoomIn">Zoom adentro</option><option value="zoomOut">Zoom afuera</option><option value="pop">Pop (rebote)</option><option value="flipX">Volteo horizontal</option><option value="flipY">Volteo vertical</option></optgroup>}
            {!isText && <optgroup label="Desenfoque"><option value="blur">Desenfoque</option><option value="blurUp">Desenfoque + subir</option><option value="blurZoom">Desenfoque + zoom</option></optgroup>}
          </select>
        </div>}
        {isText && o.textEffect && o.textEffect !== "none" && <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>La entrada y salida de este texto la hace su "Animación del texto" (en la ficha del texto): cuando pasa de Invisible a visible se arma con ese efecto, y al revés se desarma.</div>}
        <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Animación de entrada o salida al llegar a esta pose: el objeto aparece o desaparece según la pose anterior (necesita que alguna pose lo tenga invisible). Si entra, la animación va de afuera hacia su lugar; si sale, continúa hacia afuera. Probalo en Preview.</div>
        {isText && (
          <>
            <div className="grp-t" style={{ marginTop: 6 }}>Animación de texto · {currentStageLabel}</div>
            <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Estos valores se mezclan de una pose a la siguiente mientras la cámara avanza, aunque el texto esté siempre visible.</div>
            {o.textEffect && o.textEffect !== "none" && <Slider label="Revelado" min={0} max={1} step={0.01} value={t.rv ?? 1} onChange={(v) => setObjectTransform(o.id, "rv", null, v)} />}
            {o.textEffect && o.textEffect !== "none" && <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>1 = texto completo, 0 = nada. Pose A en 1 y pose B en 0: se desarma mientras la cámara va de A a B.</div>}
            <Slider label="Espacio entre letras" min={-0.3} max={3} step={0.01} value={t.tk || 0} onChange={(v) => setObjectTransform(o.id, "tk", null, v)} />
            <Slider label="Interlineado (extra)" min={-0.6} max={3} step={0.01} value={t.lh || 0} onChange={(v) => setObjectTransform(o.id, "lh", null, v)} />
          </>
        )}
        <div className="tools">
          <Btn icon="copy" onClick={() => copyObjectTransformFromPrev(o.id)} disabled={stageIndex <= 0}>Desde anterior</Btn>
          <Btn icon="pin" kind="acc" onClick={() => applyObjectTransformToAllStages(o.id)}>Fijar en todas</Btn>
        </div>
      </div>
    );
  };

  return (
    <>
      <div className="viewport" ref={viewportRef}
        style={showFx ? { background: backgroundCss(renderFx.background) } : undefined}>
        {recover && (
          <div style={{ position: "absolute", left: 12, right: 12, top: 44, zIndex: 30, background: "#2b1d4d", border: "1px solid #a78bfa", borderRadius: 10, padding: "10px 12px", color: "#fff", fontSize: 13, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <span style={{ flex: 1, minWidth: 180 }}>Hay un trabajo guardado automáticamente{recover.at ? " (" + new Date(recover.at).toLocaleString() + ")" : ""}. ¿Lo recuperás?</span>
            <span className="btn" onClick={() => { try { restoreProjectState(JSON.parse(recover.text)); setProjectLoaded(true); setTimeout(() => setProjectLoaded(false), 2500); } catch (e) { setProjectLoadError("No se pudo recuperar el guardado automático."); } setRecover(null); }}>Recuperar</span>
            <span className="btn" onClick={() => setRecover(null)}>Empezar de cero</span>
          </div>
        )}
        <div className="vp-bar">
          {[["Libre", freeOrbit, setFreeOrbit], ["Rotar", autoRotate, setAutoRotate, freeOrbit], ["Objetos", showObjects, setShowObjects], ["Grilla", showGrid, setShowGrid], ["Ambiente", showFx, setShowFx], ["9:16", showMobileFrame, setShowMobileFrame]]
            .filter((c) => c[3] === undefined || c[3])
            .map(([t, on, set]) => <span key={t} className={`vchip ${on ? "on" : ""}`} onClick={() => set(!on)}>{t}</span>)}
          {section === "objects" && showObjects && (
            <>
              <span className="vchip" style={{ opacity: 0.35, padding: 0, width: 1 }} />
              <span className={`vchip ${isolate ? "on" : ""}`} title="Muestra solo el objeto seleccionado con su grupo (madre e hijos)" onClick={() => setIsolate(!isolate)}>Aislar</span>
              <span className={`vchip ${showGhosts ? "on" : ""}`} title="Dibuja tenues los objetos que están ocultos en esta pose" onClick={() => setShowGhosts(!showGhosts)}>Fantasmas</span>
              <span className="vchip on" title="Qué etiquetas se ven en el visor: todas, solo los visibles en esta pose, solo el seleccionado o ninguna" onClick={() => setLabelMode(labelMode === "all" ? "visible" : labelMode === "visible" ? "sel" : labelMode === "sel" ? "none" : "all")}>Etiquetas: {labelMode === "all" ? "todas" : labelMode === "visible" ? "visibles" : labelMode === "sel" ? "selección" : "ninguna"}</span>
            </>
          )}
        </div>
        <div className="scene-box" style={vidBox ? { position: "fixed", inset: "auto", left: 0, top: 0, width: vidBox.w, height: vidBox.h } : (section === "pages" ? { visibility: "hidden" } : undefined)}>
        <Canvas key={canvasKey} onCreated={onCanvasCreated} shadows="soft" camera={{ position: [0, 0.3, 3.5], fov: 35, near: Math.min(2, Math.max(0.01, +postFx.camNear || 0.1)) }} dpr={exporting ? 1 : [1, 1.5]} gl={{ antialias: true, alpha: true, preserveDrawingBuffer: true }}>
          <Scene pose={currentPose} onBonesFound={setFoundMap} cameraTarget={currentCamTarget} sceneCameraActive={sceneCameraActive} autoRotate={!exporting && autoRotate} movement={currentMovement} objects={exporting ? renderObjects : viewObjects} showObjects={exporting || showObjects} showGrid={!exporting && showGrid} fx={renderFx} showFx={exporting || showFx} orbitRef={orbitRef} liveCameraRef={liveCameraRef} modelUrl={modelUrl} postFx={postFx} charScale={charScale} charCenterY={charCenterY} charAnchorRef={charAnchorRef} trail={trail} reflection={reflection}
            markers={!exporting && section === "objects" && showObjects && labelMode !== "none" ? markers : (!exporting && section === "objects" && showObjects && selObj ? markers.filter((m) => m.id === selObj.id) : null)} selectedObjectId={selectedObj} onSelectObject={setSelectedObj} />
          <CamNearSync near={Math.min(2, Math.max(0.01, +postFx.camNear || 0.1))} />
          {!exporting && <LoadMeterProbe />}
          <VideoExportBridge tag={exportT} bridgeRef={vidBridge} />
        </Canvas>
        </div>
        {showFx && (postFx.halo || 0) > 0 && <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 2, pointerEvents: "none", background: `radial-gradient(ellipse 75% 48% at 20% 0%, ${accentHalo(postFx.accent, postFx.halo)[0]} 0%, ${accentHalo(postFx.accent, postFx.halo)[1]} 42%, rgba(0,0,0,0) 74%)` }} />}
        {showFx && postFx.vignetteEnabled && (
          <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 3, pointerEvents: "none", background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - postFx.vignetteOffset) * 100}%, rgba(0,0,0,${postFx.vignetteDarkness}) 100%)` }} />
        )}
        {showMobileFrame && <MobileFrameOverlay box={phoneBox} />}
        {cursor.enabled && <CursorTrailPreview cfg={cursor} targetRef={viewportRef} />}
        {menu.logoUrl && !exporting && (
          <div style={{ position: "absolute", zIndex: 6, pointerEvents: "none", ...(phoneBox ? { left: phoneBox.left, top: phoneBox.top, width: phoneBox.w, height: phoneBox.h } : { inset: 0 }) }}>

        {menu.enabled && !exporting && (
          <div style={{ position: "absolute", zIndex: 7, pointerEvents: "none", ...(phoneBox ? { left: phoneBox.left, top: phoneBox.top, width: phoneBox.w, height: phoneBox.h } : { inset: 0 }) }}>

        {section === "pages" && <PagesPreview sections={sections} theme={site2d} view={pagesView} setView={setPagesView} replay={pgReplay} setReplay={setPgReplay} selSec={selSec} setSelSec={setSelSec} nStages={nStages} totalVh={totalVh} durationsVh={durationsVh} />}
        {!exporting && section !== "pages" && <LoadMeterHud postFx={postFx} />}

                      <div key={kf.id} className={`srow ${activeStage === kf.id ? "on" : ""}`} onClick={() => setActiveStage(kf.id)} ref={(el) => { if (el && activeStage === kf.id) el.scrollIntoView({ block: "nearest" }); }}>

                        <button className="mini" title="Subir (cambia el orden)" disabled={i === 0} onClick={(e) => { e.stopPropagation(); moveStage(kf.id, -1); }}>↑</button>

          {isPreview && (

          <div className="content">
            {section === "cfg" && (

                  <Slider label="Centro Y" min={-2} max={2} step={0.01} value={charCenterY} onChange={setCharCenterY} />
