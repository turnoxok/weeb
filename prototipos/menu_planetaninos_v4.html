<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Botones laterales · Planeta Niños (prueba v4)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root { --marca:63,138,40; --oscuro:22,70,26; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; font-family:'Montserrat',system-ui,sans-serif; }
  /* "sitio": página larga para comprobar que el scroll sigue andando con el dedo fuera de los botones */
  body { height:600vh; background:linear-gradient(#3bb5e8 0%,#9fe0c0 35%,#f5e9a8 65%,#f7b27a 100%); color:#fff; }
  .sitio { position:fixed; inset:0; display:grid; place-content:center; text-align:center; padding:24px; pointer-events:none; }
  .sitio h2 { margin:0 0 8px; font-size:1.5rem; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,.25); }
  .sitio p { margin:0; font-weight:500; opacity:.92; text-shadow:0 1px 8px rgba(0,0,0,.25); }
  .sitio b { display:block; margin-top:14px; font-size:2.4rem; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- botones laterales ---------- */
  .riel { position:fixed; top:0; right:0; bottom:0; width:84px; z-index:50; pointer-events:none; transition:opacity .5s; }
  .riel.quieta { opacity:.7; }
  .it { position:absolute; left:50%; top:0; width:44px; height:44px; margin:-22px 0 0 -22px; border:0; padding:0; background:none; color:#fff; display:grid; place-items:center; will-change:transform,opacity; pointer-events:none; }
  .it::before { content:''; position:absolute; inset:-3px; border-radius:58% 42% 52% 48% / 46% 58% 42% 54%; opacity:var(--k,0); animation:piedra 8s ease-in-out infinite;
    background:linear-gradient(145deg,rgba(var(--marca),.62),rgba(var(--marca),.3)); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 22px -10px rgba(var(--oscuro),.7); }
  @keyframes piedra { 0%,100% { transform:rotate(-7deg) scale(1); } 50% { transform:rotate(9deg) scale(1.045); } }
  .it svg { position:relative; width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 2px rgba(0,40,30,.35)); }
  .it:focus-visible { outline:2px solid #fff; outline-offset:2px; pointer-events:auto; }
  .zona { position:fixed; right:0; bottom:0; width:84px; z-index:51; touch-action:none; user-select:none; -webkit-user-select:none; }

  /* flecha: solo aparece mientras los botones se mueven */
  .flecha { position:fixed; right:84px; width:14px; height:22px; z-index:51; pointer-events:none; opacity:0; transform:translateY(-50%); transition:opacity .25s; color:#fff; filter:drop-shadow(0 1px 3px rgba(0,40,30,.4)); }
  .flecha.on { opacity:1; }
  .flecha svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  /* nombre mientras deslizás */
  .etq { position:fixed; right:112px; z-index:51; transform:translateY(-50%); font-weight:500; font-size:.98rem; letter-spacing:.01em; color:#fff; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .3s;
    text-shadow:0 0 14px rgba(var(--oscuro),.75), 0 1px 3px rgba(var(--oscuro),.45); }
  .etq.on { opacity:1; }

  /* velo esmerilado detrás de la pregunta */
  .velo { position:fixed; inset:0; z-index:49; pointer-events:none; opacity:0; transition:opacity .35s; background:rgba(255,255,255,.08); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .velo.on { opacity:1; }
  /* pregunta: burbuja de vidrio */
  .pregunta { position:fixed; right:112px; z-index:52; transform:translateY(-50%) scale(.7); transform-origin:100% 50%; opacity:0; pointer-events:none; width:max-content; min-width:176px; max-width:calc(100vw - 136px);
    display:flex; flex-direction:column; gap:12px; padding:16px 16px 14px 20px; border-radius:32px; color:#fff;
    background:linear-gradient(150deg,rgba(var(--oscuro),.5),rgba(var(--oscuro),.34)); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 18px 38px -18px rgba(0,40,30,.55);
    transition:transform .5s cubic-bezier(.2,1.2,.4,1), opacity .3s; }
  .pregunta.on { transform:translateY(-50%) scale(1); opacity:1; pointer-events:auto; }
  .gota { position:absolute; pointer-events:none; border-radius:62% 38% 54% 46% / 48% 60% 40% 52%; background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.5),rgba(var(--oscuro),.42) 62%); box-shadow:inset 0 1px 0 rgba(255,255,255,.45); animation:flota 3.4s ease-in-out infinite; }
  .gota.g1 { right:-21px; top:calc(50% - 7px); width:14px; height:12px; transform:rotate(-18deg); }
  .gota.g2 { right:-35px; top:calc(50% + 3px); width:8px; height:7px; transform:rotate(12deg); animation-delay:-1.2s; }
  @keyframes flota { 0%,100% { translate:0 0; } 50% { translate:0 -2.5px; } }
  .pregunta .q { font-weight:500; font-size:.98rem; line-height:1.25; text-wrap:balance; padding-right:4px; }
  .bt { display:flex; gap:8px; }
  .pregunta button { flex:1 1 0; font:500 .9rem 'Montserrat',sans-serif; color:#fff; background:rgba(255,255,255,.15); border:0; border-radius:999px; padding:0 14px 0 11px; min-height:40px; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; }
  .pregunta button.p { background:rgba(255,255,255,.92); color:rgb(var(--oscuro)); font-weight:600; }
  .pregunta button svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .pregunta button:active { filter:brightness(.92); }
  .pregunta button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .chispa { position:absolute; left:16px; top:-2px; width:0; height:0; pointer-events:none; }
  .chispa i { position:absolute; left:0; top:0; width:2px; height:11px; border-radius:2px; background:rgba(255,255,255,.9); transform-origin:50% 100%; opacity:0; }

  /* sección que se abre */
  .abre { position:fixed; inset:0; z-index:80; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; color:#fff;
    background:linear-gradient(160deg,rgba(var(--marca),.9),rgba(var(--oscuro),.92)); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .abre .gr { width:88px; height:88px; border-radius:58% 42% 52% 48% / 46% 58% 42% 54%; background:rgba(255,255,255,.14); display:grid; place-items:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .abre .gr svg { width:42px; height:42px; fill:none; stroke:#fff; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .abre h3 { margin:0; font-size:1.8rem; font-weight:600; }
  .abre p { margin:0; font-weight:400; opacity:.9; max-width:300px; }
  .abre button { margin-top:10px; font:500 .95rem 'Montserrat',sans-serif; min-height:48px; padding:0 30px; border:0; border-radius:999px; background:rgba(255,255,255,.92); color:rgb(var(--oscuro)); cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .pregunta { transition:opacity .2s; transform:translateY(-50%); } }
</style>
</head>
<body>
<div class="sitio"><div><h2>Acá va el sitio 3D</h2><p>Scrolleá con el dedo en cualquier parte de la pantalla. Los botones de la derecha se deslizan aparte.</p><b id="pc">0%</b></div></div>

<div class="velo" id="velo"></div>
<div class="riel" id="riel" role="toolbar" aria-label="Accesos rápidos"></div>
<div class="flecha" id="flecha" aria-hidden="true"><svg viewBox="0 0 14 22"><path d="M3 2l8 9-8 9"/></svg></div>
<div class="etq" id="etq"></div>
<div class="pregunta" id="preg" role="dialog" aria-live="polite"><span class="chispa" id="chispa"><i></i><i></i><i></i></span><i class="gota g1"></i><i class="gota g2"></i><div class="q" id="ptxt"></div>
  <div class="bt"><button class="p" id="si" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="sit">Sí</span></button>
  <button id="no" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>No</button></div></div>
<div class="abre" id="abre"><div class="gr" id="agr"></div><h3 id="at"></h3><p>Acá se abriría esta parte del sitio.</p><button id="vol" type="button">Volver</button></div>

<script>
(function () {
  /* ================= BOTONES (se editan por cliente) ================= */
  var ITEMS = [
    { nombre: 'Planes',       icono: 'precio',     pregunta: '¿Ver los planes?',        si: 'Ver' },
    { nombre: 'Galería',      icono: 'fotos',      pregunta: '¿Ver la galería?',        si: 'Ver' },
    { nombre: 'Invitaciones', icono: 'invitacion', pregunta: '¿Diseñar tu invitación?', si: 'Sí' },
    { nombre: 'Reservar',     icono: 'calendario', pregunta: '¿Ir a reservar?',         si: 'Sí' },
    { nombre: 'Panel',        icono: 'panel',      pregunta: '¿Entrar al panel?',       si: 'Entrar' },
    { nombre: 'Cómo llegar',  icono: 'mapa',       pregunta: '¿Abrir el mapa?',         si: 'Abrir' },
    { nombre: 'WhatsApp',     icono: 'chat',       pregunta: '¿Abrir WhatsApp?',        si: 'Abrir' }
  ];
  var INICIAL = 3;        // el que queda en la flecha al abrir (Reservar)
  var ALTO_FLECHA = 0.42; // la flecha está al 42% de abajo para arriba
  var VELO = true;        // el sitio se difumina un poco mientras preguntan
  /* ==================================================================== */
  /* iconos de línea fina (estilo Lucide / Font Awesome light) */
  var ICONOS = {
    precio: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".6"/>',
    fotos: '<rect width="18" height="18" x="3" y="3" rx="2.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    invitacion: '<rect width="20" height="16" x="2" y="4" rx="2.5"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    calendario: '<path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2.5"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
    panel: '<rect width="7" height="9" x="3" y="3" rx="1.5"/><rect width="7" height="5" x="14" y="3" rx="1.5"/><rect width="7" height="9" x="14" y="12" rx="1.5"/><rect width="7" height="5" x="3" y="16" rx="1.5"/>',
    mapa: '<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    chat: '<path d="M3 21l1.7-4.9A9 9 0 1 1 8 19.4z"/><path d="M9.2 8.9c.2 2.4 2.9 5.1 5.9 5.9l1.3-1.4-2.1-1.1-1 .8a4.7 4.7 0 0 1-2-2l.8-1-1.1-2.1z"/>'
  };
  var N = ITEMS.length, GAP = 52, REST_B = 76, H = 0, M = 0;
  var riel = document.getElementById('riel'), flecha = document.getElementById('flecha'), etq = document.getElementById('etq'),
      preg = document.getElementById('preg'), ptxt = document.getElementById('ptxt'), si = document.getElementById('si'), sit = document.getElementById('sit'), no = document.getElementById('no'),
      abre = document.getElementById('abre'), pc = document.getElementById('pc'), velo = document.getElementById('velo'), chispa = document.getElementById('chispa');
  var zona = document.createElement('div'); zona.className = 'zona'; document.body.appendChild(zona);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els = ITEMS.map(function (it, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'it'; b.setAttribute('aria-label', it.nombre); b.dataset.i = i;
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONOS[it.icono] + '</svg>'; riel.appendChild(b); return b;
  });
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function vibrar(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  /* ---- estado ---- */
  var pos = INICIAL, a = 0, aT = 0, vel = 0, destino = INICIAL, arrastrando = false, inercia = false, snapping = false, quiere = false, preguntando = -1, ultimo = INICIAL;
  var raf = 0, tPrev = 0, tPreg = 0, tCol = 0;
  var yRest = function (i) { var y = H - REST_B; for (var j = i; j < N - 1; j++) y -= 24 + 2.4 * (N - 2 - j); return y; };   // abajo quedan juntitos, arriba más separados
  var xRest = function (i) { return 24 * Math.pow(i / (N - 1), 1.5); };                                                   // la fila se curva hacia la esquina
  var yAct = function (i) { return M + (i - pos) * GAP; };

  function pintar() {
    var k = clamp(Math.round(pos), 0, N - 1);
    els.forEach(function (el, i) {
      var de = clamp((a - 0.4 * ((N - 1 - i) / (N - 1))) / 0.6, 0, 1), e = de * de * (3 - 2 * de);   // cada botón se despliega un instante después del anterior
      var d = Math.abs(i - pos), sA = clamp(1.3 - 0.4 * d, 0.5, 1.3), oA = clamp(1.1 - 0.3 * d, 0.1, 1);
      var sR = 0.92 - 0.07 * i, oR = 1 - 0.12 * i, bl = (1 - e) * i * 0.35, kR = 0.64 - 0.06 * i, kA = clamp(1.3 - d * 1.6, 0, 1);
      var x = xRest(i) * (1 - e), y = yRest(i) + (yAct(i) - yRest(i)) * e, s = sR + (sA - sR) * e, o = oR + (oA - oR) * e;
      if (preguntando >= 0 && i !== preguntando) o *= 0.3;
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + s.toFixed(3) + ')';
      el.style.opacity = o.toFixed(2); el.style.filter = bl > 0.05 ? 'blur(' + bl.toFixed(2) + 'px)' : '';
      el.style.setProperty('--k', (kR + (kA - kR) * e).toFixed(2));
      el.style.zIndex = String(100 - Math.round(d * 10));
    });
    var mov = arrastrando || inercia || (snapping && preguntando < 0);
    flecha.classList.toggle('on', mov && a > 0.85); flecha.style.top = M + 'px';
    etq.style.top = M + 'px'; preg.style.top = M + 'px';
    if (k !== ultimo) { ultimo = k; vibrar(6); }
    if (mov && a > 0.85) { etq.textContent = ITEMS[k].nombre; etq.classList.add('on'); } else etq.classList.remove('on');
    if (!arrastrando) zona.style.top = a > 0.5 ? '0px' : (yRest(0) - 30) + 'px';   // no se cambia el tamaño con el dedo apoyado (eso hacía titilar)
  }

  /* ---- un solo bucle: movimiento con inercia, vuelta al lugar y crecer/achicar ---- */
  function kick() { if (!raf) { tPrev = performance.now(); raf = requestAnimationFrame(frame); } }
  function frame(now) {
    var dt = Math.min(0.05, (now - tPrev) / 1000); tPrev = now; raf = 0;
    if (inercia) {
      pos += vel * dt; vel *= Math.exp(-dt * 2.6);
      if (pos < 0) { pos = 0; vel = 0; } else if (pos > N - 1) { pos = N - 1; vel = 0; }
      if (Math.abs(vel) < 0.5) { inercia = false; vel = 0; destino = clamp(Math.round(pos), 0, N - 1); snapping = true; }
    } else if (snapping) {
      var d = destino - pos;
      if (reduce || Math.abs(d) < 0.004) { pos = destino; snapping = false; if (quiere) { quiere = false; preguntar(destino); } else if (!arrastrando) programarColapso(900); }
      else pos += d * (1 - Math.exp(-dt * 16));
    }
    var ad = aT - a; a = reduce || Math.abs(ad) < 0.002 ? aT : a + ad * (1 - Math.exp(-dt * (ad > 0 ? 6 : 4)));
    pintar();
    if (arrastrando || inercia || snapping || a !== aT) kick();
  }
  function programarColapso(ms) { clearTimeout(tCol); tCol = setTimeout(function () { if (!arrastrando && !inercia && !snapping && preguntando < 0) { aT = 0; kick(); } }, ms); }

  /* ---- pregunta delicada al soltar ---- */
  function preguntar(i) {
    preguntando = i; var it = ITEMS[i];
    ptxt.textContent = it.pregunta; sit.textContent = 'Sí';
    preg.classList.add('on'); if (VELO) velo.classList.add('on'); etq.classList.remove('on'); flecha.classList.remove('on');
    clearTimeout(tPreg); tPreg = setTimeout(cancelar, 7000); vibrar(10); pintar();
    if (!reduce && chispa.children[0].animate) Array.prototype.forEach.call(chispa.children, function (c, n) {
      var ang = -70 + n * 38; c.animate([{ transform: 'rotate(' + ang + 'deg) translateY(-6px) scaleY(.2)', opacity: 0 }, { transform: 'rotate(' + ang + 'deg) translateY(-14px) scaleY(1)', opacity: 1, offset: .4 }, { transform: 'rotate(' + ang + 'deg) translateY(-18px) scaleY(.3)', opacity: 0 }], { duration: 650, delay: 180 + n * 50, easing: 'ease-out' });
    });
  }
  function cancelar() { clearTimeout(tPreg); preguntando = -1; preg.classList.remove('on'); velo.classList.remove('on'); pintar(); programarColapso(1200); }
  no.addEventListener('click', cancelar);
  document.addEventListener('pointerdown', function (e) { if (preguntando >= 0 && !preg.contains(e.target) && !zona.contains(e.target)) cancelar(); });

  /* ---- abrir con efecto: un círculo esmerilado crece desde el botón ---- */
  var abriendo = null;
  si.addEventListener('click', function () {
    var i = preguntando; if (i < 0) return; var it = ITEMS[i], r = els[i].getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    document.getElementById('agr').innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONOS[it.icono] + '</svg>'; document.getElementById('at').textContent = it.nombre;
    abre.style.display = 'flex'; abriendo = { x: x, y: y }; cancelar(); vibrar(14);
    if (!reduce && abre.animate) abre.animate([{ clipPath: 'circle(0px at ' + x + 'px ' + y + 'px)' }, { clipPath: 'circle(150vmax at ' + x + 'px ' + y + 'px)' }], { duration: 700, easing: 'cubic-bezier(.65,0,.25,1)' });
  });
  document.getElementById('vol').addEventListener('click', function () {
    var p = abriendo || { x: innerWidth - 40, y: M };
    if (!reduce && abre.animate) { var an = abre.animate([{ clipPath: 'circle(150vmax at ' + p.x + 'px ' + p.y + 'px)' }, { clipPath: 'circle(0px at ' + p.x + 'px ' + p.y + 'px)' }], { duration: 450, easing: 'ease-in', fill: 'forwards' }); an.onfinish = function () { abre.style.display = 'none'; an.cancel(); }; }
    else abre.style.display = 'none';
  });

  /* ---- dedo: solo esta zona se arrastra; el resto de la pantalla scrollea normal ---- */
  var y0 = 0, pos0 = 0, movio = false, idDedo = null, muestras = [], estabaChico = false;
  zona.addEventListener('pointerdown', function (e) {
    if (preguntando >= 0) cancelar();
    estabaChico = a < 0.5; arrastrando = true; inercia = false; snapping = false; quiere = false; movio = false; idDedo = e.pointerId; y0 = e.clientY; pos0 = pos; muestras = [[performance.now(), pos]];
    try { zona.setPointerCapture(e.pointerId); } catch (x) {}
    clearTimeout(tCol); riel.classList.remove('quieta'); aT = 1; kick();
  });
  zona.addEventListener('pointermove', function (e) {
    if (!arrastrando || e.pointerId !== idDedo) return;
    var dy = e.clientY - y0; if (Math.abs(dy) > 6) movio = true; if (!movio) return;
    var p = pos0 - dy / GAP;
    pos = p < 0 ? p * 0.35 : p > N - 1 ? N - 1 + (p - N + 1) * 0.35 : p;
    var t = performance.now(); muestras.push([t, pos]); while (muestras.length > 2 && t - muestras[0][0] > 90) muestras.shift();
    kick();
  });
  function soltar(e) {
    if (!arrastrando || (e && e.pointerId !== idDedo)) return;
    arrastrando = false; quiere = true;
    if (!movio) {                                   // un toque: elige el botón tocado
      var y = e ? e.clientY : M, mejor = 0, dm = 1e9;
      for (var i = 0; i < N; i++) { var dd = Math.abs(y - (estabaChico ? yRest(i) : yAct(i))); if (dd < dm) { dm = dd; mejor = i; } }
      destino = mejor; snapping = true;
    } else {
      pos = clamp(pos, 0, N - 1);
      var m0 = muestras[0], m1 = muestras[muestras.length - 1], dtm = (m1[0] - m0[0]) / 1000, v = dtm > 0.01 ? (m1[1] - m0[1]) / dtm : 0;
      if (Math.abs(v) > 1.6 && !reduce) { vel = clamp(v, -22, 22); inercia = true; }     // un envión: los botones siguen pasando
      else { destino = clamp(Math.round(pos), 0, N - 1); snapping = true; }
    }
    kick();
  }
  zona.addEventListener('pointerup', soltar); zona.addEventListener('pointercancel', soltar);
  riel.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { var t = e.target.closest && e.target.closest('.it'); if (t) { e.preventDefault(); aT = 1; destino = +t.dataset.i; snapping = true; quiere = true; kick(); } } });

  /* ---- scroll del sitio: los botones se vuelven más tenues mientras scrolleás ---- */
  addEventListener('scroll', function () {
    pc.textContent = Math.round(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight) * 100) + '%';
    if (a < 0.05 && !arrastrando) riel.classList.add('quieta');
  }, { passive: true });
