<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pantalla de carga · Planeta Niños (prueba)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
  :root { --verde:#3F8A28; --verde2:#7CC23A; --amarillo:#F5C93A; --naranja:#E8693A; --celeste:#3BB5E8; --rosa:#E0457B; --violeta:#7B4FD8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Montserrat',system-ui,sans-serif; background:#fff; color:var(--verde); }

  /* ---- lo que hay "debajo": el sitio (acá solo un cartel) ---- */
  .sitio { position:fixed; inset:0; display:grid; place-content:center; text-align:center; padding:24px; background:linear-gradient(#bfe8fb,#e9f7ff); color:#1d5d3a; }
  .sitio h2 { margin:0 0 8px; font-size:1.5rem; font-weight:800; }
  .sitio p { margin:0; font-weight:500; opacity:.8; }

  /* ---- pantalla de carga ---- */
  .ldr { position:fixed; inset:0; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:50; padding:0 24px; }
  .ldr.fuera { pointer-events:none; }
  .zona { position:relative; width:min(62vw,300px); height:min(54vw,262px); display:grid; place-items:center; }
  .zona > * { grid-area:1/1; }
  .mascota { width:100%; height:100%; object-fit:contain; display:block; will-change:transform; }
  .envoltorio { width:100%; height:100%; will-change:transform; }
  .texto { text-align:center; min-height:84px; }
  .msj { font-weight:700; font-size:1.05rem; letter-spacing:.2px; min-height:1.5em; transition:opacity .25s; }
  .num { font-weight:800; font-size:2.6rem; line-height:1.1; font-variant-numeric:tabular-nums; margin-top:2px; }
  .num small { font-size:1.1rem; font-weight:700; margin-left:2px; }
  .barra { position:fixed; left:0; top:0; height:4px; width:100%; background:var(--amarillo); transform-origin:left; transform:scaleX(0); }

  /* A · se llena */
  .fantasma { filter:grayscale(1); opacity:.16; }
  .color { position:relative; }

  /* B · asoma */
  .ventana { position:relative; width:100%; height:100%; overflow:hidden; }
  .ventana .envoltorio { transform:translateY(105%); }
  .suelo { position:absolute; left:6%; right:6%; bottom:0; height:12px; border-radius:12px 12px 0 0; background:var(--verde2); z-index:2; }

  /* C · globos */
  .globos { position:absolute; inset:0; pointer-events:none; }
  .globo { position:absolute; left:50%; bottom:46%; width:46px; transform-origin:50% 100%; transform:translateX(var(--x)) scale(0); }
  .globo > svg { display:block; width:100%; overflow:visible; animation:bob 2.4s ease-in-out infinite; animation-delay:var(--d); }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-5px) rotate(2deg); } }

  /* confeti */
  .confeti { position:fixed; left:0; top:0; width:11px; height:16px; border-radius:2px; pointer-events:none; z-index:80; will-change:transform,opacity; }
  .confeti.r { border-radius:50%; width:12px; height:12px; }

  /* controles de la prueba (no son parte del loader) */
  .ctl { position:fixed; left:50%; bottom:max(12px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:100; display:flex; gap:6px; padding:6px; border-radius:16px; background:rgba(20,30,24,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100vw - 16px); }
  .ctl button, .ctl select { font:600 .74rem 'Montserrat',sans-serif; min-height:40px; padding:0 11px; border-radius:11px; border:0; color:#fff; background:rgba(255,255,255,.12); }
  .ctl button.on { background:var(--naranja); }
  .ctl select { appearance:none; -webkit-appearance:none; padding-right:11px; }
  .ctl button:focus-visible, .ctl select:focus-visible { outline:3px solid #fff; outline-offset:1px; }
  @media (prefers-reduced-motion: reduce) { .globo > svg { animation:none; } }
</style>
</head>
<body>
<div class="sitio"><div><h2>Acá se abre el sitio</h2><p>Tocá “Repetir” para ver la carga otra vez.</p></div></div>
<div class="barra" id="barra"></div>
<div class="ldr" id="ldr" role="status" aria-live="polite" aria-label="Cargando">
  <div class="zona" id="zona"></div>
  <div class="texto"><div class="msj" id="msj">Inflando globos…</div><div class="num"><span id="num">0</span><small>%</small></div></div>
</div>
<div class="ctl" id="ctl">
  <button data-v="A" class="on" type="button">A · Se llena</button>
  <button data-v="B" type="button">B · Asoma</button>
  <button data-v="C" type="button">C · Globos</button>
  <select id="vel" aria-label="Duración de la prueba"><option value="4">4 s</option><option value="10" selected>10 s (real)</option><option value="20">20 s (lento)</option></select>
  <button id="rep" type="button">Repetir</button><span style="align-self:center;color:#fff;opacity:.55;font:600 .62rem Montserrat,sans-serif;padding:0 4px">v3</span>
</div>

    for (var i = 0; i < n; i++) {
      var p = document.createElement('i'); p.className = 'confeti' + (i % 4 === 0 ? ' r' : ''); p.style.background = PAL[i % PAL.length];
      document.body.appendChild(p);
      var ang = (-90 + (Math.random() - .5) * 150) * Math.PI / 180, fuerza = 120 + Math.random() * 210, dx = Math.cos(ang) * fuerza, dy = Math.sin(ang) * fuerza, caida = 160 + Math.random() * 260, rot = (Math.random() - .5) * 900, dur = 1300 + Math.random() * 900;
      var a = p.animate([
        { transform: 'translate(' + ox + 'px,' + oy + 'px) rotate(0deg) scale(.6)', opacity: 1, offset: 0 },
        { transform: 'translate(' + (ox + dx * .75) + 'px,' + (oy + dy) + 'px) rotate(' + rot * .5 + 'deg) scale(1)', opacity: 1, offset: .38, easing: 'cubic-bezier(.3,0,.9,.6)' },
        { transform: 'translate(' + (ox + dx) + 'px,' + (oy + dy + caida) + 'px) rotate(' + rot + 'deg) scale(1)', opacity: 0, offset: 1 }
      ], { duration: dur, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'forwards' });
      a.onfinish = (function (el) { return function () { el.remove(); }; })(p);
    }
  }
  var textoFiesta = null;
  function festejo(t) {
    confeti();
    if (partes.w && !reduce) partes.w.animate([{ transform: partes.w.style.transform || 'none' }, { transform: 'scale(1.1,.92)' }, { transform: 'scale(.95,1.08)' }, { transform: partes.w.style.transform || 'none' }], { duration: 520, easing: 'ease-out' });
    textoFiesta = t; msj.textContent = t; clearTimeout(festejo.t); festejo.t = setTimeout(function () { textoFiesta = null; }, 1500);
  }

  /* ---------- actualización por progreso ---------- */
  function mensaje(p) { return p < 30 ? 'Inflando globos…' : p < 70 ? 'Armando el planeta…' : p < 100 ? 'Prendiendo las luces…' : '¡Listo!'; }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }
  function pintar(p) {
    num.textContent = Math.floor(p); barra.style.transform = 'scaleX(' + (p / 100) + ')';
    if (!textoFiesta) msj.textContent = mensaje(p);
    if (variante === 'A') partes.c.style.clipPath = 'inset(' + (100 - p) + '% 0 0 0)';
    else if (variante === 'B') partes.e.style.transform = 'translateY(' + ((1 - ease(p / 100)) * 105) + '%)';
    else partes.g.forEach(function (d, i) { var k = Math.max(0, Math.min(1, (p - i * 18) / 20)), s = k < 1 ? ease(k) * 1.04 : 1; d.style.transform = 'translateX(var(--x)) scale(' + s + ')'; });
    if (p >= 30 && !hechos[30]) { hechos[30] = 1; festejo('¡Ya va tomando forma! 🎉'); }
    if (p >= 70 && !hechos[70]) { hechos[70] = 1; festejo('¡Ya casi está! 🎉'); }
  }

  /* ---------- salida ---------- */
  function salir(id) {
    if (id !== corrida) return;
    var d = 700;
    ldr.classList.add('fuera');
    if (variante === 'A') {
      partes.w.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.12)', opacity: 1, offset: .25 }, { transform: 'scale(26)', opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.6,0,.9,.4)', fill: 'forwards' });
      ldr.animate([{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: 900, fill: 'forwards' });
    } else if (variante === 'B') {
      partes.e.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-14%)', offset: .35 }, { transform: 'translateY(0)' }], { duration: 520, easing: 'ease-out' });
      ldr.animate([{ clipPath: 'circle(150% at 50% 52%)' }, { clipPath: 'circle(150% at 50% 52%)', offset: .3 }, { clipPath: 'circle(0% at 50% 52%)' }], { duration: 1000, easing: 'ease-in-out', fill: 'forwards' });
    } else {
      partes.g.forEach(function (g, i) { g.animate([{ transform: g.style.transform }, { transform: 'translateX(var(--x)) translateY(-130vh) scale(1)' }], { duration: 1100 + i * 90, delay: i * 70, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }); });
      ldr.animate([{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: 1300, fill: 'forwards' });
    }
    setTimeout(function () { if (id === corrida) ldr.style.display = 'none'; }, 1400);
  }

  /* ---------- corrida ---------- */
  function correr() {
    cancelAnimationFrame(raf); corrida++; var id = corrida; hechos = {}; textoFiesta = null;
    document.querySelectorAll('.confeti').forEach(function (e) { e.remove(); });
    armar(); pintar(0);
    var dur = (+vel.value) * 1000, t0 = performance.now(), fin = false;
    (function tick(now) {
      if (id !== corrida) return;
      var t = Math.min(1, (now - t0) / dur), p = prog(t); pintar(p);
      if (t < 1) raf = requestAnimationFrame(tick); else if (!fin) { fin = true; setTimeout(function () { salir(id); }, 450); }
    })(t0);
  }

  document.getElementById('ctl').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { variante = b.dataset.v; document.querySelectorAll('.ctl [data-v]').forEach(function (x) { x.classList.toggle('on', x === b); }); }
    correr();
  });
  vel.addEventListener('change', correr);
  var im = new Image(); im.onload = im.onerror = correr; im.src = IMG;
})();
</script>
